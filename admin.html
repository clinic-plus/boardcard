<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://qiejgpvawhxzqmxdjmbd.supabase.co wss://qiejgpvawhxzqmxdjmbd.supabase.co; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boardcard Admin</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1FB; --surface:#FFFFFF; --ink:#0B2038; --muted:#51647A; --line:#CBD8EA;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --bad:#B93A32; --good-bg:#DCE9FB; --bad-bg:#F8E1DE;
  --gold:#8A5F0A; --gold-bg:#F6EBCF;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.8); --glass-brd:rgba(255,255,255,.8);
  --field:rgba(255,255,255,.65); --fbrd:rgba(31,95,191,.2); --chip:rgba(31,95,191,.09);
  --glass-sh:0 10px 30px -14px rgba(20,60,130,.4), inset 0 1px 0 rgba(255,255,255,.85);
  --shadow:0 12px 30px -16px rgba(20,60,130,.45), inset 0 1px 0 rgba(255,255,255,.9);
  --b1:rgba(90,150,255,.55); --b2:rgba(150,190,255,.6); --b3:rgba(60,120,230,.4);
  --btn-top:#3B7DE8; --btn-bot:#1A56B0;
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121C; --surface:#10263A; --ink:#E8F0F8; --muted:#93A9C0; --line:#25405A;
    --accent:#6AA5FF; --accent-ink:#06162F; --bad:#FF8A80; --good-bg:#12294A; --bad-bg:#3B1D1F;
    --gold:#E6B955; --gold-bg:#35290F;
    --glass:rgba(24,48,80,.5); --glass-strong:rgba(16,36,62,.82); --glass-brd:rgba(255,255,255,.14);
    --field:rgba(255,255,255,.07); --fbrd:rgba(255,255,255,.16); --chip:rgba(255,255,255,.08);
    --glass-sh:0 10px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
    --shadow:0 12px 30px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
    --b1:rgba(46,110,230,.45); --b2:rgba(30,90,170,.35); --b3:rgba(80,70,210,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121C; --surface:#10263A; --ink:#E8F0F8; --muted:#93A9C0; --line:#25405A;
  --accent:#6AA5FF; --accent-ink:#06162F; --bad:#FF8A80; --good-bg:#12294A; --bad-bg:#3B1D1F;
  --gold:#E6B955; --gold-bg:#35290F;
  --glass:rgba(24,48,80,.5); --glass-strong:rgba(16,36,62,.82); --glass-brd:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.07); --fbrd:rgba(255,255,255,.16); --chip:rgba(255,255,255,.08);
  --glass-sh:0 10px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
  --shadow:0 12px 30px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
  --b1:rgba(46,110,230,.45); --b2:rgba(30,90,170,.35); --b3:rgba(80,70,210,.28);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,var(--b1),transparent 70%),radial-gradient(35% 35% at 85% 25%,var(--b2),transparent 70%),radial-gradient(45% 40% at 30% 90%,var(--b3),transparent 70%)}
@keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}
button{font:inherit;color:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .4s var(--spring),box-shadow .25s,filter .2s,background .25s}
button:active{transition-duration:.08s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .grp{display:flex;gap:8px;align-items:center}
.brand{font-weight:700;font-size:22px;letter-spacing:0}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
/* glass primitives */
.glass,.stats,.row,.item,.setting,.empty,.pill,.seg,.ib,.sbar .back,.x{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd)}
.pill{border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600;box-shadow:var(--glass-sh)}
button.pill{min-height:40px}
button.pill:active,.ib:active,.back:active,.x:active{transform:scale(.92)}
.pill.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.btn{border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:12px 18px;font-weight:600;color:#fff;min-height:48px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 22px -10px rgba(26,86,176,.85),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.14)}
.btn:active{transform:scale(.94);filter:brightness(1.1);box-shadow:0 4px 10px -6px rgba(26,86,176,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.line{color:var(--ink);background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(185,58,50,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;box-shadow:var(--glass-sh);margin-bottom:16px}
.stat{padding:12px 8px;text-align:center}
.stat+.stat{border-inline-start:1px solid var(--glass-brd)}
.stat b{display:block;font-size:24px;line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;margin:16px 0 12px;box-shadow:var(--glass-sh)}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px;font-weight:600;color:var(--muted)}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:0 6px 14px -6px rgba(26,86,176,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.row,.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--glass-sh);border-inline-start:6px solid var(--sc)}
.row:active{transform:scale(.97)}
.row .nm,.item .nm{font-weight:600;font-size:17px}
.row .sub,.item .sub{font-size:13px;color:var(--muted)}
.row .grow,.item .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--chip);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sc);border-radius:6px}
.row .bar i{transform-origin:right;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.lock{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-bg);border-radius:8px;padding:2px 8px;white-space:nowrap}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 8px;padding:12px 14px;border-radius:20px;box-shadow:var(--glass-sh)}
.sw{width:52px;height:32px;border-radius:32px;border:0;background:rgba(120,140,165,.35);position:relative;flex:none;overflow:visible;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:26px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:inset-inline-start .35s var(--spring),width .2s}
.sw[aria-checked="true"]{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot))}
.sw[aria-checked="true"]::after{inset-inline-start:23px}
.sw:active::after{width:32px}
.sw[aria-checked="true"]:active::after{inset-inline-start:17px}
.note{font-size:13px;color:var(--muted);margin-top:24px}
.note button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;overflow:visible}
.empty{border-radius:20px;border-style:dashed;padding:20px 16px;text-align:center;color:var(--muted);margin:12px 0}
.empty .btn{margin-top:8px}
/* study */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sbar .back{border-radius:16px;width:44px;height:44px;font-size:20px;flex:none;box-shadow:var(--glass-sh)}
.prog{flex:1}
.prog .bar{margin-top:0;height:8px}
.prog .bar i{background:linear-gradient(90deg,var(--btn-bot),var(--btn-top));transition:width .5s}
.tbar{height:4px;background:transparent;margin-bottom:12px;border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:right}
.scene{perspective:1400px}
.card{display:grid;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--glass-brd);border-top:8px solid var(--sc);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.card:not(.flipped) .face.back,.card.flipped .face.front{visibility:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:1px 12px;background:var(--chip);color:var(--muted)}
.tag.s{background:var(--sc);color:#fff}
.q{font-size:21px;font-weight:600;line-height:1.7;margin:0 0 16px;unicode-bidi:plaintext}
.opts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--fbrd);background:var(--field);border-radius:16px;padding:10px 12px;min-height:50px}
.opt:active{transform:scale(.97)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fbrd);display:grid;place-items:center;font-weight:600;font-size:14px}
.opt .t{unicode-bidi:plaintext;flex:1}
.opt.good{background:var(--good-bg);border-color:var(--accent);animation:pop .45s var(--spring)}
.opt.good .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
.opt.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
@keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.res{font-weight:700;font-size:18px;margin:0 0 12px}
.res.ok{color:var(--accent)} .res.no{color:var(--bad)} .res.mid{color:var(--muted)}
.exp{background:var(--chip);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:16px;unicode-bidi:plaintext}
.exp b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px;font-weight:600}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.sum{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-brd);border-radius:28px;padding:24px 18px;box-shadow:var(--glass-sh);text-align:center;animation:rise .5s var(--spring)}
.sum .big{font-size:56px;font-weight:700;line-height:1.2}
.sum p{margin:6px 0 16px;color:var(--muted)}
.sum .btn{margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
.gate{background:var(--gold-bg);color:var(--gold);border-radius:16px;padding:12px;margin:16px 0;font-weight:500;text-align:start}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,22,44,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .25s}
.sheet{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--glass-brd);border-bottom:0;width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -20px 60px -20px rgba(10,40,100,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:up .5s cubic-bezier(.2,.9,.25,1.05)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:5px;background:var(--muted);opacity:.35}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 12px;font-size:22px}
.price{display:flex;align-items:baseline;gap:6px;margin:12px 0}
.price b{font-size:36px}
.sheet ul{padding-inline-start:20px;margin:8px 0 16px}
.pay{font-size:14px;color:var(--muted);margin-bottom:16px}
.code{display:flex;gap:8px;margin-top:8px}
.code input{flex:1;min-width:0;border:1px solid var(--fbrd);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;direction:ltr;text-align:center;letter-spacing:1px;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:6px 0 0}
.x{float:inline-end;border-radius:50%;width:40px;height:40px;font-size:18px}
/* admin */
.banner{font-size:13px;border-radius:14px;padding:8px 12px;margin-bottom:12px;background:var(--gold-bg);color:var(--gold)}
.banner.ok{background:var(--good-bg);color:var(--accent)}
.item .qt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
.cov{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--glass-brd)}
.cov.pt{width:56px;height:79px;border-radius:10px}
.cvbox{display:flex;align-items:center;gap:12px}
.cvbox .cov{width:80px;height:80px}
.cvbox .cov.pt{width:80px;height:113px}
.cvbox .bk{width:80px;height:113px}
/* غلاف على شكل كتاب */
.bk{position:relative;display:block;flex:none;width:64px;height:90px;border-radius:2px 7px 7px 2px;direction:ltr;
  box-shadow:3px 0 0 -1px #f4f1ea,4px 0 0 -1px #cfc9bb,5px 8px 14px -4px rgba(10,30,70,.5),-1px 0 0 rgba(0,0,0,.25);background:#fff}
.bk .cov,.bk .cov.pt{width:100%;height:100%;border-radius:inherit;display:block;object-fit:cover}
.bk::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.38) 0,rgba(255,255,255,.3) 2px,rgba(0,0,0,.16) 5px,rgba(255,255,255,.1) 8px,rgba(0,0,0,0) 12px),
             linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,0) 38%,rgba(0,0,0,.12))}

.cvph{width:80px;height:80px;border-radius:14px;border:1.5px dashed var(--glass-brd);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;flex:none}
.cvph.pt{height:113px}
.item .acts2{display:flex;flex-direction:column;gap:6px;flex:none}
.ib{border-radius:12px;padding:4px 12px;min-height:40px;font-size:14px;font-weight:600}
.ib.del{color:var(--bad);border-color:transparent;background:var(--bad-bg)}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.in{width:100%;border:1px solid var(--fbrd);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;unicode-bidi:plaintext}
textarea.in{min-height:84px;resize:vertical}
.r2{display:flex;gap:8px}.r2>*{flex:1;min-width:0}
.orow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.orow input[type=radio]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.orow .l{flex:none;width:24px;text-align:center;font-weight:600;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.cols{display:flex;flex-wrap:wrap;gap:10px}
.cl{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 2px var(--fbrd),inset 0 1px 0 rgba(255,255,255,.5)}
.cl:active{transform:scale(.85)}
.cl[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.hint pre{background:var(--chip);border-radius:12px;padding:8px 12px;margin:6px 0 0;white-space:pre-wrap;font:inherit;unicode-bidi:plaintext}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;background:rgba(11,32,56,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;border:1px solid rgba(255,255,255,.18);padding:12px 16px;border-radius:18px;z-index:30;text-align:center;animation:rise .4s var(--spring)}

.face{position:relative}
.wm{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background-repeat:repeat;z-index:2}
.auth{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-brd);border-radius:28px;padding:20px 18px;box-shadow:var(--glass-sh);animation:rise .5s var(--spring)}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;overflow:visible;font-weight:600}
.seg button{padding:8px 2px;font-size:14px}
h3.sec{margin:20px 0 8px;font-size:17px}
.codebox{width:100%;min-height:120px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.5px}
.terms{font-size:15px;line-height:1.9}
.acts3{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts3 .ib{min-height:36px;padding:2px 10px;font-size:13px}
.terms li{margin-bottom:6px}

.ov{touch-action:none;overscroll-behavior:contain}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-height:92vh;max-height:92dvh}
.wa{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:10px 12px;margin:0 0 12px}
.wa span{font-size:13px;color:var(--muted)}
.wa b{flex:1;font-size:20px;letter-spacing:.5px}
.stats.tap{cursor:pointer;transition:transform .4s var(--spring)}
.stats.tap:active{transform:scale(.97)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.kpi{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--glass-sh);padding:12px 14px}
.kpi b{display:block;font-size:28px;line-height:1.3}
.kpi span{display:block;font-weight:600;font-size:14px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--glass-sh);padding:12px 12px 8px}
.chart{display:flex;align-items:stretch;gap:6px;height:150px}
.chart.dense{gap:2px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.chart .val{font-size:11px;font-weight:600;color:var(--muted);min-height:16px}
.chart .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bw i{display:block;width:70%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));opacity:.55;transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.chart.dense .bw i{width:80%;max-width:12px;border-radius:4px 4px 2px 2px}
.chart .col.today .bw i{opacity:1}
.chart em{font-style:normal;font-size:11px;color:var(--muted);min-height:18px;line-height:18px;white-space:nowrap}
@keyframes growY{from{transform:scaleY(0)}}
.rep{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:8px 2px;font-size:13px;border-bottom:1px solid var(--glass-brd)}
.rep:last-child{border-bottom:0}
.rep span:first-child{font-weight:600}
.seg.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seg.tabs::-webkit-scrollbar{display:none}
.seg.tabs button{flex:0 0 auto;padding:8px 14px;white-space:nowrap}

.brandrow{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.bmark{width:38px;height:38px;object-fit:contain;flex:none}
.logoplate{background:#fff;border-radius:26px;padding:14px 20px;display:flex;justify-content:center;box-shadow:var(--glass-sh);margin:0 auto 14px;width:max-content;max-width:100%}
.splash{display:grid;place-items:center;gap:6px;padding-top:12vh;text-align:center}
/* ripple */
.rp{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);transform:scale(0);animation:rp .65s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* ---------- حركات الظهور (مثل الموقع) ---------- */
@keyframes bcIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
.kpi,.item,.row,.panel,.sec,.sum{animation:bcIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*60ms + .05s)}
.row .bar i{animation-delay:calc(var(--i,0)*60ms + .45s)}
@media (prefers-reduced-motion: reduce){
  body::before{animation:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rp{display:none}
}

/* ===== تحسينات الواجهة ===== */
.pill,.ib{white-space:nowrap}
.banner .pill{flex:none}
.item{position:relative;border-inline-start:1px solid var(--glass-brd)}
.item::before{content:"";position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:4px;border-radius:4px;background:var(--sc)}
.seg.tabs{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);padding-inline-end:24px}
@media (min-width:900px){
  .wrap{max-width:860px}
  .seg.tabs{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none;padding-inline-end:4px}
  .seg.tabs button{flex:1 0 auto}
}

function shrinkImage(file){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type)){rej(new Error('اختر ملف صورة.'));return}
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=async()=>{
    URL.revokeObjectURL(url);
    const k=Math.min(1,IMG_MAXSIDE/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    const enc=(t,qv)=>new Promise(r=>c.toBlob(r,t,qv));
    try{
      let b=null;
      for(const qv of [.82,.7,.6,.5,.4]){
        b=await enc('image/webp',qv);
        if(!b||b.type!=='image/webp')b=await enc('image/jpeg',qv);
        if(b&&b.size<=IMG_MAXBYTES)break;
      }
      if(!b||b.size>IMG_MAXBYTES){rej(new Error('الصورة كبيرة جداً بعد الضغط. قصّها أو صغّرها.'));return}
      res(b);
    }catch(e){rej(new Error('تعذر معالجة الصورة'))}
  };
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('ملف الصورة غير صالح'))};
  im.src=url;
})}
async function imgCall(method,path,body,type){

  if(!r.ok||!j){
    if(r.status===403||r.status===401)throw new Error('ما عندك صلاحية لرفع الصور.');
    if(r.status===413)throw new Error('الصورة كبيرة جداً.');
    throw new Error('تعذر رفع الصورة. تأكد من تحديث الموقع ثم جرب مرة ثانية.');
  }
  return j;
}
const imgKind=u=>{

  if(u.length>3&&u[0]===0xff&&u[1]===0xd8&&u[2]===0xff)return 'jpg';
  if(u.length>8&&u[0]===0x89&&u[1]===0x50&&u[2]===0x4e&&u[3]===0x47)return 'png';
  return null;
};
async function readZip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('ملف ZIP غير صالح.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  const out=[],td=new TextDecoder('utf-8');
  for(let k=0;k<n;k++){
    if(p+46>buf.byteLength||dv.getUint32(p,true)!==0x02014b50)throw new Error('ملف ZIP غير صالح.');
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    let data=u8.subarray(ds,ds+csz);
    if(method===8){
      const s=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      data=new Uint8Array(await new Response(s).arrayBuffer());
    }else if(method!==0)continue;
    out.push({name:name,data:data});
  }
  return out;
}

const RLABEL={wrong_answer:'الجواب الصحيح غير صحيح',explanation:'الشرح خاطئ أو ناقص',typo:'خطأ إملائي أو لغوي',unclear:'السؤال أو الخيارات غير واضحة',other:'سبب آخر'};
async function loadRequests(){
  const el=$('rqlist');if(!el)return;
  const done=A.qs==='done';
  const r=await sb.from('subject_requests').select('*').eq('status',done?'done':'new').order('created_at',{ascending:false}).limit(100);
  if(!$('rqlist'))return;
  if(r.error){$('rqlist').innerHTML=`<p class="err">${esc(errMsg(r.error))}</p>`;return}
  const rows=r.data;
  if(!rows.length){$('rqlist').innerHTML=`<div class="empty">${done?'لا توجد طلبات منجزة.':'لا توجد طلبات جديدة.'}</div>`;return}
  const uids=[...new Set(rows.map(x=>x.user_id))];
  const pr=await sb.from('profiles').select('id,full_name,username').in('id',uids);
  const pm={};(pr.data||[]).forEach(p=>{pm[p.id]=p});
  if(!$('rqlist'))return;
  $('rqlist').innerHTML=rows.map(x=>{
    const p=pm[x.user_id]||{},sp=spById(x.specialty_id);
    return `<div class="item" style="--sc:${safeC(sp.c)};align-items:flex-start"><div class="grow">
      <div class="nm">${esc(x.subject_name||'')}</div>
      <div class="sub">${esc(sp.n)}، ${esc(p.full_name||p.username||'')}${p.username?' (@'+esc(p.username)+')':''}، ${fdate(x.created_at)}</div>
      ${x.note?`<div class="sub" dir="auto" style="color:var(--ink)">${esc(x.note)}</div>`:''}
      <div class="sub" dir="auto">${esc(x.file_name||'')}</div>
      <div class="acts3"><button class="ib" data-rqd="${esc(x.id)}">تنزيل الملف</button><button class="ib" data-rqv="${esc(x.id)}">${done?'إعادة فتح':'تم الإنجاز'}</button><button class="ib del" data-rqx="${esc(x.id)}">حذف</button></div></div></div>`;
  }).join('');
  const byId={};rows.forEach(x=>{byId[x.id]=x});
  $('rqlist').querySelectorAll('[data-rqd]').forEach(b=>b.onclick=async()=>{
    const x=byId[b.dataset.rqd];
    const u=await sb.storage.from('request-files').createSignedUrl(x.file_path,300,{download:x.file_name||true});
    if(u.error){toast(errMsg(u.error));return}
    window.open(u.data.signedUrl,'_blank');
  });
  $('rqlist').querySelectorAll('[data-rqv]').forEach(b=>b.onclick=async()=>{
    const u=await sb.from('subject_requests').update({status:done?'new':'done'}).eq('id',b.dataset.rqv);
    if(u.error){toast(errMsg(u.error));return}
    admin();
  });
  $('rqlist').querySelectorAll('[data-rqx]').forEach(b=>b.onclick=async()=>{
    const x=byId[b.dataset.rqx];
    if(!await askConfirm('حذف الطلب','سيُحذف الطلب مع الملف المرفق نهائياً.','احذف'))return;
    try{await sb.storage.from('request-files').remove([x.file_path])}catch(e){}
    const d=await sb.from('subject_requests').delete().eq('id',x.id);
    if(d.error){toast(errMsg(d.error));return}
    toast('تم الحذف');admin();
  });
}
async function inboxBadge(){
  try{
    const [q,r]=await Promise.all([sb.from('subject_requests').select('id',{count:'exact',head:true}).eq('status','new'),sb.from('question_reports').select('id',{count:'exact',head:true}).eq('status','open')]);
    const nq=q.error?0:(q.count||0),nr=r.error?0:(r.count||0);
    const t=app.querySelector('[data-t="inbox"]');if(t&&nq+nr>0)t.textContent='التبليغات والطلبات ('+(nq+nr)+')';
    const br=$('ibr'),bq=$('ibq');
    if(br&&nr>0)br.textContent='تبليغات عن أسئلة ('+nr+')';
    if(bq&&nq>0)bq.textContent='طلبات المواد ('+nq+')';

async function loadReports(){
  const el=$('rplist');if(!el)return;
  const r=await sb.from('question_reports').select('*').eq('status',A.rs).order('created_at',{ascending:false}).limit(100);
  if(!$('rplist'))return;
  if(r.error){$('rplist').innerHTML=`<p class="err">${esc(errMsg(r.error))}</p>`;return}
  const rows=r.data;
  if(!rows.length){$('rplist').innerHTML=`<div class="empty">${A.rs==='open'?'لا توجد تبليغات مفتوحة. ممتاز.':'لا توجد تبليغات محلولة بعد.'}</div>`;return}
  const qids=[...new Set(rows.map(x=>x.question_id))],uids=[...new Set(rows.map(x=>x.user_id))];
  const [qr,pr]=await Promise.all([sb.from('questions').select('*').in('id',qids),sb.from('profiles').select('id,full_name,username').in('id',uids)]);
  const qm={},pm={};(qr.data||[]).forEach(q=>{qm[q.id]=q});(pr.data||[]).forEach(p=>{pm[p.id]=p});
  QL=qr.data||[];
  if(!$('rplist'))return;
  $('rplist').innerHTML=rows.map(x=>{
    const q=qm[x.question_id],p=pm[x.user_id]||{},sj=q?subjOf(q.s):{n:'',c:'#5A6B77'};
    return `<div class="item" style="--sc:${safeC(sj.c)};align-items:flex-start"><div class="grow">
      <div class="qt" dir="${q?dirOf(q.q):'rtl'}">${q?esc(q.q):'سؤال محذوف'}</div>
      <div class="sub"><b>${esc(RLABEL[x.reason]||x.reason)}</b></div>
      ${x.note?`<div class="sub" dir="auto" style="color:var(--ink)">${esc(x.note)}</div>`:''}
      <div class="sub">${esc(p.full_name||p.username||'')}${p.username?' (@'+esc(p.username)+')':''}، ${fdate(x.created_at)}، ${esc(sj.n)}</div>
      <div class="acts3">${q?`<button class="ib" data-oq="${esc(q.id)}">فتح السؤال</button>`:''}<button class="ib" data-rv="${esc(x.id)}">${A.rs==='open'?'تم الحل':'إعادة فتح'}</button><button class="ib del" data-rd="${esc(x.id)}">حذف</button></div></div></div>`;
  }).join('');
  $('rplist').querySelectorAll('[data-oq]').forEach(b=>b.onclick=()=>questionForm(b.dataset.oq));
  $('rplist').querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{
    const u=await sb.from('question_reports').update({status:A.rs==='open'?'resolved':'open'}).eq('id',b.dataset.rv);
    if(u.error){toast(errMsg(u.error));return}
    toast(A.rs==='open'?'تم تحديد التبليغ كمحلول':'أُعيد فتح التبليغ');admin();
  });
  $('rplist').querySelectorAll('[data-rd]').forEach(b=>b.onclick=async()=>{
    if(!(await askConfirm('حذف التبليغ','سيُحذف هذا التبليغ نهائياً.','احذف')))return;
    const d=await sb.from('question_reports').delete().eq('id',b.dataset.rd);
    if(d.error){toast(errMsg(d.error));return}
    toast('تم حذف التبليغ');admin();
  });
}

function audienceHtml(){
  return `<div class="fld"><span>لمن يظهر؟ (يمكن اختيار أكثر من فئة)</span>
    <label class="chk"><input type="checkbox" id="aud-all" checked><span>كل الطلاب والزوار</span></label>
    ${Store.specialties.map(p=>`<label class="chk" style="margin-top:0"><input type="checkbox" data-aud="${esc(p.id)}"><span>مشتركو ${esc(p.n)} فقط</span></label>`).join('')}</div>`;
}
function bindAudience(){
  const all=$('aud-all');if(!all)return;
  const sps=()=>Array.from(document.querySelectorAll('[data-aud]'));
  all.onchange=()=>{if(all.checked)sps().forEach(x=>{x.checked=false});else if(!sps().some(x=>x.checked))all.checked=true};
  sps().forEach(x=>x.onchange=()=>{if(x.checked)all.checked=false;else if(!sps().some(y=>y.checked))all.checked=true});
}
const readAudience=()=>Array.from(document.querySelectorAll('[data-aud]:checked')).map(x=>x.dataset.aud);
const audText=x=>{
  const ids=(x.sp_ids&&x.sp_ids.length)?x.sp_ids:(x.specialty_id?[x.specialty_id]:[]);
  return ids.length?'مشتركو '+ids.map(i=>spById(i).n).join('، '):'كل الطلاب والزوار';
};

const dayStart=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],0,0,0)};
const dayEnd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],23,59,59)};
async function publishSponsor(){
  const nm=$('spn').value.trim(),msg=$('spm').value.trim(),link=$('spl').value.trim(),cta=$('spc').value.trim()||'انتقل الآن',s=$('sps').value,e=$('spe').value,er=$('er');
  if(!nm){er.textContent='اكتب اسم الراعي.';return}

  let ok=/^https?:\/\/\S+$/i.test(link);try{if(ok)new URL(link)}catch(x){ok=false}
  if(!ok){er.textContent='اكتب رابطاً صحيحاً يبدأ بـ https://';return}
  if(!e){er.textContent='اختر تاريخ انتهاء الإعلان.';return}
  const ends=dayEnd(e),starts=s?dayStart(s):null;
  if(ends<=new Date()){er.textContent='تاريخ الانتهاء يجب أن يكون اليوم أو بعده.';return}
  if(starts&&starts>=ends){er.textContent='تاريخ البداية يجب أن يسبق تاريخ الانتهاء.';return}
  er.textContent='';$('spsv').disabled=true;
  const id=(crypto.randomUUID&&crypto.randomUUID())||null;
  const row={kind:'sponsor',message:msg,sponsor_name:nm,link_url:link,cta:cta,sp_ids:readAudience(),ends_at:ends.toISOString()};
  if(id)row.id=id;
  if(starts)row.starts_at=starts.toISOString();
  let path=null;
  try{
    if(SPBLOB){
      path='ads/'+(id||Date.now())+'-'+Date.now()+'.jpg';
      const u=await sb.storage.from('covers').upload(path,SPBLOB,{contentType:'image/jpeg',upsert:true});
      if(u.error)throw u.error;
      row.image_url=sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
    }
    const r=await sb.from('announcements').insert(row);
    if(r.error){if(path){try{await sb.storage.from('covers').remove([path])}catch(x){}}throw r.error}
    toast('تم نشر الإعلان الممول');admin();
  }catch(x){er.textContent=errMsg(x);$('spsv').disabled=false}
}

/* ---------- نسخة احتياطية ---------- */
function downloadFile(name,text,type){
  const blob=new Blob([text],{type:type});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

async function exportBackup(kind){
  toast('جارٍ تحضير الملف…');
  try{
    const [sp,su,sy,qs]=await Promise.all([
      fetchAll(()=>sb.from('specialties').select('*').order('id')),
      fetchAll(()=>sb.from('subjects').select('*').order('id')),
      fetchAll(()=>sb.from('systems').select('*').order('id')),
      fetchAll(()=>sb.from('questions').select('*').order('id'))]);
    const day=new Date().toISOString().slice(0,10);
    if(kind==='full'){
      const ac=await sb.rpc('admin_backup_accounts');
      if(ac.error)throw ac.error;
      downloadFile('boardcard-FULL-backup-'+day+'.json',JSON.stringify({app:'boardcard-full',version:1,exported_at:new Date().toISOString(),note:'بدون كلمات السر',content:{specialties:sp,subjects:su,systems:sy,questions:qs},accounts:ac.data},null,1),'application/json');
      try{localStorage.setItem('bc_last_backup',String(Date.now()))}catch(e){}
    }else if(kind==='json'){
      downloadFile('boardcard-backup-'+day+'.json',JSON.stringify({app:'boardcard',version:1,exported_at:new Date().toISOString(),specialties:sp,subjects:su,systems:sy,questions:qs},null,1),'application/json');
      try{localStorage.setItem('bc_last_backup',String(Date.now()))}catch(e){}
    }else{
      const spn={},sun={},syn={};sp.forEach(x=>{spn[x.id]=x.n});su.forEach(x=>{sun[x.id]={n:x.n,sp:spn[x.sp]||''}});sy.forEach(x=>{syn[x.id]=x.n});
      const cell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
      const head=['id','specialty','subject','system','exam','year','free','question','A','B','C','D','E','F','correct','explanation'];
      const lines=[head.join(',')].concat(qs.map(q=>{
        const o=q.o||[],s=sun[q.s]||{n:q.s,sp:''};
        return [q.id,s.sp,s.n,syn[q.sy]||'',q.ex,q.y||'',q.free?'yes':'no',q.q,o[0],o[1],o[2],o[3],o[4],o[5],LET[q.a]||'',q.e].map(cell).join(',');

      downloadFile('boardcard-questions-'+day+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');

  }catch(e){toast(errMsg(e))}
}

/* ---------- أسعار البيع (للإيراد): تُدخل عند كل بيع ---------- */
const RP_KEY='bc_recent_prices';
const recentPrices=()=>{try{return JSON.parse(localStorage.getItem(RP_KEY)||'[]').filter(x=>x>=0).slice(0,4)}catch(e){return []}};
function priceField(id,label){
  const rp=recentPrices();
  return `<label class="fld"><span>${label}</span><input class="in" id="${id}" type="number" min="0" inputmode="numeric" placeholder="اكتب 0 إذا كان مجانياً" style="direction:ltr;text-align:center"></label>${rp.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px"><small style="color:var(--muted);align-self:center">آخر الأسعار:</small>${rp.map(p=>`<button type="button" class="pill" data-pp="${id}|${p}">${p?ar(p.toLocaleString('en-US')):'مجاني'}</button>`).join('')}</div>`:''}`;
}
function bindPriceChips(){document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{const [id,p]=b.dataset.pp.split('|');const el=$(id);if(el){el.value=p;el.focus()}})}
function readPrice(id){const el=$(id),v=el?parseFloat(el.value):NaN;return v>=0&&v<=10000000?v:null}
async function recordSale(o){
  try{
    const r=await sb.rpc('admin_record_sale',{p_kind:o.kind,p_specialty:o.sp||null,p_days:o.days||null,p_qty:o.qty||1,p_price:o.price,p_user:o.user||null,p_note:o.note||null});
    if(r.error)throw r.error;
    const rp=recentPrices().filter(x=>x!==o.price);rp.unshift(o.price);
    try{localStorage.setItem(RP_KEY,JSON.stringify(rp.slice(0,4)))}catch(e){}
  }catch(e){toast('تنبيه: لم يُسجَّل المبلغ في الإيراد، سجّله يدوياً أو أعد العملية.')}
}
async function makeCodes(){
  const n=parseInt($('cn').value,10),d=parseInt($('cdays').value,10),note=$('cnote').value.trim()||null;
  if(!(n>=1&&n<=50)||!(d>=1&&d<=365)){$('er').textContent='العدد من 1 إلى 50، والمدة من 1 إلى 365 يوم.';return}
  const price=readPrice('cprice');
  if(price===null){$('er').textContent='اكتب سعر الكود الواحد (0 إذا مجاني).';return}
  $('er').textContent='';$('mk').disabled=true;
  const sp=$('csp').value;
  if(!sp){$('er').textContent='أضف اختصاصاً أولاً.';$('mk').disabled=false;return}
  const r=await sb.rpc('admin_create_codes',{p_specialty:sp,p_count:n,p_days:d,p_note:note});
  $('mk').disabled=false;
  if(r.error){$('er').textContent=errMsg(r.error);return}
  await recordSale({kind:'code',sp:sp,days:d,qty:r.data.length,price:price,note:note});
  const txt=r.data.join('\n');
  $('newcodes').innerHTML=`<h3 class="sec">الأكواد الجديدة (${ar(r.data.length)})</h3><textarea class="in codebox" id="cbx" readonly>${esc(txt)}</textarea><button class="btn line block" id="cp" style="margin-top:8px">نسخ الكل</button>`;
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('تم النسخ')}catch(e){$('cbx').select();toast('حدد النص وانسخه يدوياً')}};
  loadCodes();
}
async function loadCodes(){
  const r=await sb.from('activation_codes').select('*').order('created_at',{ascending:false}).limit(100);
  const el=$('codelist');if(!el)return;
  if(r.error){el.innerHTML=`<p class="err">${esc(errMsg(r.error))}</p>`;return}
  el.innerHTML=r.data.length?r.data.map(c=>`<div class="item" style="--sc:${c.used_by?'#5A6B77':'#1F5FBF'}"><div class="grow"><div class="nm" dir="ltr" style="text-align:start">${esc(c.code)}</div>
    <div class="sub">${esc(spById(c.specialty_id).n)}، ${ar(c.days)} يوم${c.note?'، '+esc(c.note):''}</div></div><span class="tag">${c.used_by?'مستخدم':'غير مستخدم'}</span></div>`).join(''):'<div class="empty">لا توجد أكواد بعد.</div>';
}
let USERS=[];
async function loadUsers(){
  const el=$('ulist');

function renderUsers(){
  const el=$('ulist');if(!el)return;
  const f=A.fu,now=Date.now();
  const WK=7*864e5;
  const liveOf=u=>(u.subs||[]).filter(x=>new Date(x.exp)>now);
  const isSoon=u=>u.role!=='admin'&&liveOf(u).some(x=>new Date(x.exp)-now<=WK);
  const isEnded=u=>u.role!=='admin'&&(u.subs||[]).length>0&&liveOf(u).length===0;
  const nextExp=u=>Math.min.apply(null,liveOf(u).map(x=>+new Date(x.exp)));
  const cs=USERS.filter(isSoon).length,ce=USERS.filter(isEnded).length;
  app.querySelectorAll('[data-fx="soon"]').forEach(b=>b.textContent='ينتهي خلال 7 أيام ('+ar(cs)+')');
  app.querySelectorAll('[data-fx="ended"]').forEach(b=>b.textContent='منتهي ('+ar(ce)+')');
  let list=USERS.filter(u=>!f||((u.full_name||'')+' '+(u.username||'')).toLowerCase().includes(f));
  if(A.fx==='soon')list=list.filter(isSoon).sort((a,b)=>nextExp(a)-nextExp(b));
  else if(A.fx==='ended')list=list.filter(isEnded);
  el.innerHTML=list.length?list.map(u=>{
    const subs=u.subs||[];
    const live=subs.filter(x=>new Date(x.exp)>now);
    const act=live.length>0;
    const stud=u.role!=='admin';
    const pend=u.codes||[];
    const stTxt=u.blocked?'موقوف':(act?'فعّال':(subs.length?'منتهي':(pend.length?'بانتظار التفعيل':'بدون اشتراك')));
    const subsHtml=subs.length?subs.map(x=>{const on=new Date(x.exp)>now;return `<div class="sub" style="margin-top:4px"><b>${esc(spById(x.sp).n)}</b>${on?'':' (منتهي)'}<br>تاريخ الاشتراك: ${fdate(x.st||u.created_at)}، تاريخ الانتهاء: ${fdate(x.exp)}${on&&(new Date(x.exp)-now)<=7*864e5?` <b style="color:#B93A32">⚠ باقي ${ar(Math.max(1,Math.ceil((new Date(x.exp)-now)/864e5)))} يوم</b>`:''}</div>`}).join(''):(pend.length?'':'<div class="sub" style="margin-top:4px">لا يوجد اشتراك.</div>');
    const pendHtml=pend.map(c=>`<div class="sub" style="margin-top:4px;color:#8A5F0A"><b>رمز تفعيل لم يُستخدم:</b> <bdi dir="ltr" style="font-family:ui-monospace,Menlo,monospace;user-select:all">${esc(c.code)}</bdi><br>${esc(spById(c.sp).n)}، ${ar(c.days)} يوم. يبدأ الاشتراك وتظهر تواريخه عندما يدخل الطالب الرمز، أو اضغط «تفعيل الآن».</div>`).join('');
    const refHtml=stud?`<div class="sub" style="margin-top:4px">كود دعوته: <bdi dir="ltr" style="font-family:ui-monospace,Menlo,monospace;user-select:all">${esc(u.ref_code||'')}</bdi>، المشتركون بكوده: <b>${ar(u.ref_cnt||0)}</b>${u.ref_pend?' (بانتظار الاشتراك '+ar(u.ref_pend)+')':''}${u.ref_by?`، دعاه: <b>${esc(u.ref_by)}</b>${u.ref_by_amb?' 🎓 سفير، يستحق المدعو خصم 30% + 3 أيام':''} (${({pending:'بانتظار أول اشتراك',rewarded:'تمت المكافأة',no_inviter_sub:'تمت مكافأته، والداعي بلا اشتراك',invalid:'غير صالحة'})[u.ref_status]||esc(u.ref_status||'')})`:''}</div>`:'';
    const ambHtml=stud&&u.is_amb?`<div class="sub" style="margin-top:4px">🎓 <b>سفير دفعة</b>: مستحقاته النقدية ${ar(u.ref_amb||0)} اشتراك × ${ar('3,000')} د. المدفوع له ${ar(u.ref_paid||0)} من ${ar(u.ref_amb||0)}، المتبقي <b>${ar((((u.ref_amb||0)-(u.ref_paid||0))*3000).toLocaleString('en'))} د</b></div>`:'';
    const pwHtml='';
    return `<div class="item" style="--sc:${u.blocked?'#B93A32':(act?'#1F5FBF':'#5A6B77')};align-items:flex-start"><div class="grow"><div class="nm">${esc(u.full_name||'بدون اسم')}${u.role==='admin'?' (أدمن)':''}</div>
      <div class="sub">اسم المستخدم: <bdi dir="ltr" style="user-select:all">${esc(u.username||'')}</bdi></div>${pwHtml}${refHtml}${ambHtml}
      <div class="sub" style="margin-top:4px">الحالة: ${stTxt}، تاريخ إنشاء الحساب: ${fdate(u.created_at)}${u.last_login?'، آخر دخول '+fdate(u.last_login):''}</div>${subsHtml}${pendHtml}
      <div class="acts3"><button class="ib" data-ur="${esc(u.id)}">تجديد</button>${stud?`${pend.length?`<button class="ib" data-uact="${esc(u.id)}">تفعيل الآن</button>`:''}<button class="ib" data-ued="${esc(u.id)}">تعديل</button><button class="ib" data-uamb="${esc(u.id)}">${u.is_amb?'إلغاء السفير':'تحويل إلى سفير'}</button>${u.is_amb?`<button class="ib" data-upaid="${esc(u.id)}">تسجيل دفع</button>`:''}<button class="ib" data-ucp="${esc(u.id)}">نسخ المعلومات</button>${act?`<button class="ib" data-uchg="${esc(u.id)}">تغيير الاشتراك</button><button class="ib del" data-ucan="${esc(u.id)}">إلغاء الاشتراك</button>`:''}<button class="ib" data-up="${esc(u.id)}">كلمة سر جديدة</button><button class="ib ${u.blocked?'':'del'}" data-ub="${esc(u.id)}">${u.blocked?'رفع الإيقاف':'إيقاف'}</button><button class="ib del" data-udel="${esc(u.id)}">حذف</button>`:''}</div></div></div>`}).join('')
    :'<div class="empty">لا يوجد طلاب مطابقون.</div>';
  el.querySelectorAll('[data-ur]').forEach(b=>b.onclick=()=>renewForm(USERS.find(x=>x.id===b.dataset.ur)));
  el.querySelectorAll('[data-ub]').forEach(b=>b.onclick=async()=>{
    const u=USERS.find(x=>x.id===b.dataset.ub);
    if(!u.blocked){const ok=await askConfirm('إيقاف الحساب','سيُمنع «'+(u.full_name||u.username)+'» من الدخول للمحتوى.','أوقف');if(!ok)return}
    const r=await sb.rpc('admin_set_blocked',{p_user:u.id,p_blocked:!u.blocked});
    if(r.error){toast(errMsg(r.error));return}
    toast(u.blocked?'تم رفع الإيقاف':'تم إيقاف الحساب');loadUsers();
  });
  el.querySelectorAll('[data-ucan]').forEach(b=>b.onclick=()=>{
    const u=USERS.find(x=>x.id===b.dataset.ucan),l=liveOf(u);
    if(l.length)cancelSubForm(u,l);
  });
  el.querySelectorAll('[data-uchg]').forEach(b=>b.onclick=()=>{
    const u=USERS.find(x=>x.id===b.dataset.uchg),l=liveOf(u);
    if(l.length)changeSubForm(u,l);
  });
  el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>resetPasswordForm(USERS.find(x=>x.id===b.dataset.up)));
  el.querySelectorAll('[data-uact]').forEach(b=>b.onclick=async()=>{
    const u=USERS.find(x=>x.id===b.dataset.uact),c=(u.codes||[])[0];if(!c)return;
    if(!(await askConfirm('تفعيل الاشتراك','سيبدأ اشتراك «'+(u.full_name||u.username)+'» في «'+spById(c.sp).n+'» الآن لمدة '+ar(c.days)+' يوم.','فعّل')))return;
    b.disabled=true;
    const r=await sb.rpc('admin_activate_code',{p_code:c.code});
    if(r.error){b.disabled=false;toast(errMsg(r.error));return}
    toast('تم تفعيل الاشتراك');loadUsers();
  });
  el.querySelectorAll('[data-ued]').forEach(b=>b.onclick=()=>editStudentForm(USERS.find(x=>x.id===b.dataset.ued)));
  el.querySelectorAll('[data-uamb]').forEach(b=>b.onclick=async()=>{
    const u=USERS.find(x=>x.id===b.dataset.uamb),on=!u.is_amb,nm=u.full_name||u.username;
    if(!(await askConfirm(on?'تحويل إلى سفير':'إلغاء السفير',on?'«'+nm+'» يحصل على 10 أيام مجانية + 3,000 د عن كل اشتراك جديد بكوده، والمدعو يحصل على خصم 30% مع الأيام الثلاثة المجانية. ينطبق على الاشتراكات القادمة فقط.':'تنتهي مكافآت السفير للاشتراكات القادمة، وتبقى مستحقاته السابقة كما هي.',on?'حوّل':'ألغِ')))return;
    const r=await sb.rpc('admin_set_ambassador',{p_user:u.id,p_on:on});
    if(r.error){toast(errMsg(r.error));return}
    toast(on?'تم تحويله إلى سفير':'تم إلغاء السفير');loadUsers();
  });
  el.querySelectorAll('[data-upaid]').forEach(b=>b.onclick=()=>paidForm(USERS.find(x=>x.id===b.dataset.upaid)));
  el.querySelectorAll('[data-udel]').forEach(b=>b.onclick=async()=>{
    const u=USERS.find(x=>x.id===b.dataset.udel);
    if(!(await askConfirm('حذف الحساب','سيُحذف حساب «'+(u.full_name||u.username)+'» نهائياً مع اشتراكه وملاحظاته وتقدمه. لا يمكن التراجع.','احذف')))return;
    b.disabled=true;
    const r=await sb.functions.invoke('student-admin',{body:{action:'delete',user_id:u.id}});
    if(r.error||(r.data&&r.data.error)){b.disabled=false;toast('تعذر حذف الحساب. جرب مرة ثانية.');return}
    imgCall('DELETE','/api/data?uid='+encodeURIComponent(u.id)).catch(()=>{});
    toast('تم حذف الحساب');loadUsers();

  el.querySelectorAll('[data-ucp]').forEach(b=>b.onclick=()=>{

// زر تجديد واحد: تمديد مباشر أو كود تفعيل، بأي مدة
function renewForm(u){
  if(!Store.specialties.length){toast('أضف اختصاصاً أولاً');return}
  const stud=u.role!=='admin',subs=u.subs||[];
  const has=sp=>subs.some(x=>x.sp===sp);
  const first=subs[0]?subs[0].sp:Store.specialties[0].id;
  showModal(`<button class="x" id="cl" aria-label="إغلاق">✕</button><h2>تجديد الاشتراك</h2>
    <p class="hint" style="margin:0 0 8px">${esc(u.full_name||u.username)}</p>
    <label class="fld"><span>الاختصاص</span><select class="in" id="rsp">${Store.specialties.map(p=>`<option value="${esc(p.id)}" ${p.id===first?'selected':''}>${esc(p.n)}</option>`).join('')}</select></label>
    <label class="fld"><span>المدة بالأيام</span><input class="in" id="rdd" type="number" min="1" max="365" value="30" style="direction:ltr;text-align:center"></label>
    ${stud?`<label class="fld"><span>طريقة التجديد</span><select class="in" id="rmd"><option value="now">تمديد مباشر الآن (بدون كود)</option><option value="code">كود تفعيل أعطيه للطالب</option></select></label><p class="hint" id="rhn"></p>`:''}
    ${priceField('rpr','المبلغ المدفوع بالدينار (للإيراد)')}
    <p class="err" id="er" role="alert"></p><button class="btn block" id="rgo">تجديد</button>`);
  $('cl').onclick=closeModal;bindPriceChips();
  const sync=()=>{
    if(!stud)return;
    const h=has($('rsp').value);
    $('rmd').value=h?'now':'code';
    $('rhn').textContent=h?'التمديد المباشر يضيف المدة من تاريخ انتهاء اشتراكه الحالي (أو من اليوم إن كان منتهياً).':'ليس لديه اشتراك في هذا الاختصاص، فالأفضل إنشاء كود تفعيل له.';
  };
  $('rsp').onchange=sync;sync();
  $('rgo').onclick=async()=>{
    const sp=$('rsp').value,days=parseInt($('rdd').value,10),mode=stud?$('rmd').value:'now';
    if(!(days>=1&&days<=365)){$('er').textContent='المدة من 1 إلى 365 يوم.';return}
    const price=readPrice('rpr');
    if(price===null){$('er').textContent='اكتب المبلغ المدفوع (0 إذا مجاني).';return}
    $('rgo').disabled=true;$('er').textContent='';
    if(mode==='now'){
      const cur=subs.find(x=>x.sp===sp);
      const base=Math.max(Date.now(),cur?+new Date(cur.exp):0);
      const r=await sb.rpc('admin_set_expiry',{p_user:u.id,p_specialty:sp,p_expires:new Date(base+days*864e5).toISOString()});
      if(r.error){$('er').textContent=errMsg(r.error);$('rgo').disabled=false;return}
      await recordSale({kind:'extend',sp:sp,days:days,qty:1,price:price,user:u.id});
      closeModal();toast('تم تمديد الاشتراك '+ar(days)+' يوماً');loadUsers();
    }else{
      const r=await sb.rpc('admin_create_codes',{p_specialty:sp,p_count:1,p_days:days,p_note:'تجديد',p_user:u.id});
      if(r.error){$('er').textContent=errMsg(r.error);$('rgo').disabled=false;return}
      await recordSale({kind:'renew',sp:sp,days:days,qty:1,price:price,user:u.id});
      const sn=spById(sp).n;
      showCredentials('كود لـ '+(u.full_name||u.username),[['الاختصاص',sn],['رمز التفعيل',r.data[0]]],'الاختصاص: '+sn+'\nرمز التفعيل: '+r.data[0]+'\nالمدة: '+days+' يوم');
      loadUsers();
    }
  };
}
// إنهاء اشتراك طالب في اختصاص فوراً: يُضبط تاريخ الانتهاء إلى الماضي (ويبقى السجل)، وإن رفضت الدالة ذلك يُحذف السجل
async function endSub(u,sp){
  const r=await sb.rpc('admin_set_expiry',{p_user:u.id,p_specialty:sp,p_expires:new Date(Date.now()-60000).toISOString()});
  if(!r.error)return null;
  const d=await sb.from('subscriptions').delete().eq('user_id',u.id).eq('specialty_id',sp).select();
  if(d.error||!(d.data&&d.data.length))return r.error;
  return null;
}

  const nm=u.full_name||u.username;

  const left=x=>Math.min(365,Math.max(1,Math.ceil((new Date(x.exp)-Date.now())/864e5)));

function squareJpeg(file,size){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2,out=Math.min(size,m);
    const c=document.createElement('canvas');c.width=out;c.height=out;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,out,out);x.drawImage(im,sx,sy,m,m,0,0,out,out);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('تعذر معالجة الصورة')),'image/jpeg',.82);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('ملف الصورة غير صالح'))};
  im.src=url;
})}
function fitJpeg(file,maxW,maxH){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
    const k=Math.min(1,maxW/im.width,maxH/im.height),w=Math.round(im.width*k),h=Math.round(im.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
    URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error('تعذر معالجة الصورة')),'image/jpeg',.85);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('ملف الصورة غير صالح'))};
  im.src=url;
})}

/* إضافة جماعية: نص منسق */
function normKey(k){
  k=String(k).trim().toLowerCase().charAt(0);
  const m={'ا':'أ','أ':'أ','ب':'ب','ج':'ج','د':'د','ه':'هـ','a':'أ','b':'ب','c':'ج','d':'د','e':'هـ','f':'و'};
  return m[k]||k;
}
function parseBulk(text){
  const blocks=text.split(/^\s*-{3,}\s*$/m).map(b=>b.trim()).filter(Boolean);
  const items=[],errors=[];
  blocks.forEach((b,bi)=>{
    const q=[],o=[],ex=[];let ans=null,mode='q',m,img=null;
    for(const raw of b.split('\n')){
      const l=raw.trim();
      if(!l){if(mode==='e')ex.push('');continue}
      if(m=l.match(/^(?:الجواب|الاجابة|الإجابة|answer)\s*[:：]\s*(.+)$/i)){ans=m[1].trim();mode='a';continue}
      if(m=l.match(/^(?:الشرح|التفسير|explanation)\s*[:：]\s*(.*)$/i)){ex.push(m[1]);mode='e';continue}
      if(mode!=='e'&&(m=l.match(/^(?:image|img|صورة)\s*[:：]\s*(\S.*)$/i))){img=m[1].trim();continue}
      if(mode==='e'){ex.push(l);continue}
      if(mode!=='a'&&(m=l.match(/^([أابجدهـA-Fa-f])\s*[\)\.\-:]\s*(.+)$/))){o.push({k:normKey(m[1]),t:m[2].trim()});mode='o';continue}
      if(mode==='q')q.push(l);else if(mode==='o'&&o.length)o[o.length-1].t+=' '+l;
    }
    const n=bi+1;
    if(!q.length){errors.push('السؤال '+ar(n)+': لا يوجد نص للسؤال.');return}
    if(o.length<2){errors.push('السؤال '+ar(n)+': يحتاج خيارين على الأقل.');return}
    if(o.length>6){errors.push('السؤال '+ar(n)+': أكثر من 6 خيارات.');return}
    let a=-1;
    if(ans){const k=normKey(ans);a=o.findIndex(x=>x.k===k);if(a<0&&/^[1-6]/.test(ans.trim()))a=parseInt(ans.trim(),10)-1}
    if(a<0||a>=o.length){errors.push('السؤال '+ar(n)+': الجواب غير محدد أو لا يطابق الخيارات.');return}
    if(img&&!/\.(jpe?g|png|webp)$/i.test(img)){errors.push('السؤال '+ar(n)+': اسم الصورة يجب أن ينتهي بـ jpg أو png أو webp.');return}
    items.push({q:q.join('\n'),o:o.map(x=>x.t),a:a,e:ex.join('\n').trim(),img:img});
  });
  return {items,errors};
}

        if(/\.zip$/i.test(f.name)||/zip/.test(f.type)){
          for(const z of await readZip(await f.arrayBuffer())){
            const b=baseName(z.name);
            if(b.startsWith('.')||/__macosx/i.test(z.name)||!/\.(jpe?g|png|webp)$/.test(b))continue;
            imgs.set(b,{name:b,data:z.data});
          }
        }else if(/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name)){
          imgs.set(baseName(f.name),{name:f.name,data:new Uint8Array(await f.arrayBuffer())});
        }
      }
      parsed=null;$('an').textContent='تحليل النص';$('pv').innerHTML='';
      $('bimgInfo').textContent=imgs.size?'تم تحميل '+ar(imgs.size)+' صورة.':'لم أجد صوراً صالحة في الملف.';
    }catch(e){$('bimgInfo').textContent=errText(e)}
  };
  $('an').onclick=async()=>{
    if(parsed&&parsed.items.length){
      const meta=readMeta();$('an').disabled=true;
      const up=new Map();
      try{
        const names=Array.from(new Set(parsed.items.filter(x=>x.img).map(x=>baseName(x.img))));
        const total=names.length;let nDone=0,stop=false;
        const worker=async()=>{
          while(!stop&&names.length){
            const nm=names.shift();
            try{
              const path=await uploadImg(await prepImage(imgs.get(nm)));
              up.set(nm,path);nDone++;
              $('pv').innerHTML='<div class="banner">جارٍ رفع الصور '+ar(nDone)+' / '+ar(total)+'…</div>';
            }catch(e){stop=true;throw e}
          }
        };
        if(total){
          const rs=await Promise.allSettled([worker(),worker(),worker()]);
          const bad=rs.find(r=>r.status==='rejected');
          if(bad){up.forEach(p=>deleteImgFile(p));throw bad.reason}
        }
        const t0=Date.now();
        try{
          await putMany('questions',parsed.items.map((it,i)=>({id:newId('q')+i,s:meta.s,sy:meta.sy,ex:meta.ex,y:meta.y,free:meta.free,q:it.q,o:it.o,a:it.a,e:it.e,img:it.img?up.get(baseName(it.img)):null,t:t0+i})));
        }catch(e){up.forEach(p=>deleteImgFile(p));throw e}
        A.last={s:meta.s,ex:meta.ex,y:meta.y||A.last.y,free:meta.free};
        closeModal();toast('تمت إضافة '+ar(parsed.items.length)+' سؤال');
      }catch(e){$('er').textContent=errText(e);$('pv').innerHTML='';$('an').disabled=false}
      return;
    }
    parsed=parseBulk($('bt').value);
    $('er').textContent='';
    const miss=[];
    parsed.items=parsed.items.filter(it=>{if(it.img&&!imgs.has(baseName(it.img))){miss.push(it.img);return false}return true});
    parsed.errors=parsed.errors.concat(miss.map(n=>'الصورة غير موجودة ضمن الصور المختارة: '+n));
    const withImg=parsed.items.filter(it=>it.img).length;
    $('pv').innerHTML=`<div class="banner ${parsed.items.length?'ok':''}">تم التعرف على ${ar(parsed.items.length)} سؤال صحيح${withImg?'، منها '+ar(withImg)+' بصور':''}${parsed.errors.length?'، و'+ar(parsed.errors.length)+' فيها مشاكل':''}.</div>${parsed.errors.map(x=>`<p class="err">${esc(x)}</p>`).join('')}`;
    if(parsed.items.length)$('an').textContent='أضف '+ar(parsed.items.length)+' سؤال';
    else parsed=null;
  };
  $('bt').oninput=()=>{parsed=null;$('an').textContent='تحليل النص';$('pv').innerHTML=''};
}



/* ---------- دخول الأدمن ---------- */
function adminLogin(notice){
  view='auth';
  app.innerHTML=`<div class="top"><div class="brand">${brandHtml()}<small>لوحة التحكم</small></div></div>
  <div class="auth">
    ${logoPlate(120)}
    ${notice?`<div class="banner">${esc(notice)}</div>`:''}
    <label class="fld"><span>الإيميل</span><input class="in" id="au-e" type="email" inputmode="email" autocomplete="email" style="direction:ltr;text-align:left"></label>
    <label class="fld"><span>كلمة السر</span><input class="in" id="au-p" type="password" autocomplete="current-password" style="direction:ltr;text-align:left"></label>
    <p class="err" id="er" role="alert"></p>
    <button class="btn block" id="au-go">دخول</button>
  </div>`;
  $('au-go').onclick=async()=>{
    const email=$('au-e').value.trim(),password=$('au-p').value;
    if(!email||!password){$('er').textContent='اكتب الإيميل وكلمة السر.';return}
    $('au-go').disabled=true;
    try{
      const r=await sb.auth.signInWithPassword({email:email,password:password});
      if(r.error){$('er').textContent='الإيميل أو كلمة السر غير صحيحة.';$('au-go').disabled=false;return}
      startAdmin();
    }catch(e){$('er').textContent='تعذر الاتصال. جرب مرة ثانية.';$('au-go').disabled=false}
  };
}
async function adminLogout(){
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  Store.user=null;Store.isAdmin=false;Store.ready=false;
  adminLogin();
}
async function startAdmin(){
  boot();
  try{
    const g=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    if(!g.data.session){adminLogin();return}
    Store.user=g.data.session.user;
    await loadMe();
    if(!Store.isAdmin){
      try{await sb.auth.signOut({scope:'local'})}catch(e){}
      Store.user=null;adminLogin('هذا الحساب ليس لديه صلاحية الدخول إلى لوحة التحكم.');return;
    }
    await loadAll();
    Store.ready=true;admin();
  }catch(e){app.innerHTML=`<div class="top"><div class="brand">${brandHtml()}<small>لوحة التحكم</small></div></div><p class="empty">تعذر تحميل البيانات. تأكد من الاتصال وأعد فتح الصفحة.</p><button class="btn block" onclick="location.reload()">إعادة المحاولة</button>`}
}
document.addEventListener('pointerdown',function(e){
  var t=e.target.closest&&e.target.closest('.btn,.row,.opt,.ib,.pill,.seg button,.back,.x,.cl');
  if(!t||t.disabled)return;
  var r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,sp=document.createElement('span');
  sp.className='rp';
  sp.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  t.appendChild(sp);setTimeout(function(){sp.remove()},700);
  try{if(navigator.vibrate)navigator.vibrate(6)}catch(x){}
},{passive:true});
startAdmin();
</script>
