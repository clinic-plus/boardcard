<style>
:root{
  --bg:#EAF1FB; --surface:#FFFFFF; --ink:#0B2038; --muted:#51647A; --line:#CBD8EA;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --bad:#B93A32; --good-bg:#DCE9FB; --bad-bg:#F8E1DE;
  --gold:#8A5F0A; --gold-bg:#F6EBCF;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.8); --glass-brd:rgba(255,255,255,.8);
  --field:rgba(255,255,255,.65); --fbrd:rgba(31,95,191,.2); --chip:rgba(31,95,191,.09);
  --glass-sh:0 10px 30px -14px rgba(20,60,130,.4), inset 0 1px 0 rgba(255,255,255,.85);
  --shadow:0 12px 30px -16px rgba(20,60,130,.45), inset 0 1px 0 rgba(255,255,255,.9);
  --b1:rgba(90,150,255,.55); --b2:rgba(150,190,255,.6); --b3:rgba(60,120,230,.4);
  --btn-top:#3B7DE8; --btn-bot:#1A56B0;
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121C; --surface:#10263A; --ink:#E8F0F8; --muted:#93A9C0; --line:#25405A;
    --accent:#6AA5FF; --accent-ink:#06162F; --bad:#FF8A80; --good-bg:#12294A; --bad-bg:#3B1D1F;
    --gold:#E6B955; --gold-bg:#35290F;
    --glass:rgba(24,48,80,.5); --glass-strong:rgba(16,36,62,.82); --glass-brd:rgba(255,255,255,.14);
    --field:rgba(255,255,255,.07); --fbrd:rgba(255,255,255,.16); --chip:rgba(255,255,255,.08);
    --glass-sh:0 10px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
    --shadow:0 12px 30px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
    --b1:rgba(46,110,230,.45); --b2:rgba(30,90,170,.35); --b3:rgba(80,70,210,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121C; --surface:#10263A; --ink:#E8F0F8; --muted:#93A9C0; --line:#25405A;
  --accent:#6AA5FF; --accent-ink:#06162F; --bad:#FF8A80; --good-bg:#12294A; --bad-bg:#3B1D1F;
  --gold:#E6B955; --gold-bg:#35290F;
  --glass:rgba(24,48,80,.5); --glass-strong:rgba(16,36,62,.82); --glass-brd:rgba(255,255,255,.14);
  --field:rgba(255,255,255,.07); --fbrd:rgba(255,255,255,.16); --chip:rgba(255,255,255,.08);
  --glass-sh:0 10px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12);
  --shadow:0 12px 30px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
  --b1:rgba(46,110,230,.45); --b2:rgba(30,90,170,.35); --b3:rgba(80,70,210,.28);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;min-height:100vh}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 15%,var(--b1),transparent 70%),radial-gradient(35% 35% at 85% 25%,var(--b2),transparent 70%),radial-gradient(45% 40% at 30% 90%,var(--b3),transparent 70%)}
@keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}
button{font:inherit;color:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .4s var(--spring),box-shadow .25s,filter .2s,background .25s}
button:active{transition-duration:.08s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .grp{display:flex;gap:8px;align-items:center}
.brand{font-weight:700;font-size:22px;letter-spacing:0}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
/* glass primitives */
.glass,.stats,.row,.item,.fold,.reqb,.setting,.empty,.pill,.seg,.ib,.sbar .back,.x{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd)}
.pill{border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600;box-shadow:var(--glass-sh)}
button.pill{min-height:40px}
button.pill:active,.ib:active,.back:active,.x:active{transform:scale(.92)}
.pill.gold{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.btn{border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:12px 18px;font-weight:600;color:#fff;min-height:48px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 22px -10px rgba(26,86,176,.85),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.14)}
.btn:active{transform:scale(.94);filter:brightness(1.1);box-shadow:0 4px 10px -6px rgba(26,86,176,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.line{color:var(--ink);background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
.btn.bad{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(185,58,50,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-radius:22px;box-shadow:var(--glass-sh);margin-bottom:16px}
.stat{padding:12px 8px;text-align:center}
.stat+.stat{border-inline-start:1px solid var(--glass-brd)}
.stat b{display:block;font-size:24px;line-height:1.3}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;margin:16px 0 12px;box-shadow:var(--glass-sh)}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px;font-weight:600;color:var(--muted)}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:0 6px 14px -6px rgba(26,86,176,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.row,.item{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--glass-sh);border-inline-start:6px solid var(--sc)}
.row:active{transform:scale(.97)}
.cov{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--glass-brd)}
.cov.pt{width:56px;height:79px;border-radius:10px}
/* غلاف على شكل كتاب */
.bk{position:relative;display:block;flex:none;width:64px;height:90px;border-radius:2px 7px 7px 2px;direction:ltr;
  box-shadow:3px 0 0 -1px #f4f1ea,4px 0 0 -1px #cfc9bb,5px 8px 14px -4px rgba(10,30,70,.5),-1px 0 0 rgba(0,0,0,.25);background:#fff}
.bk .cov,.bk .cov.pt{width:100%;height:100%;border-radius:inherit;display:block;object-fit:cover}
.bk::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.38) 0,rgba(255,255,255,.3) 2px,rgba(0,0,0,.16) 5px,rgba(255,255,255,.1) 8px,rgba(0,0,0,0) 12px),
             linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,0) 38%,rgba(0,0,0,.12))}

.folds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fold{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:start;border-radius:20px;padding:14px;box-shadow:var(--glass-sh);border-top:5px solid var(--sc)}
.fold .ic{font-size:28px;line-height:1.1}
.fold .nm{font-weight:600;font-size:16px}
.fold .sub{font-size:12.5px;color:var(--muted)}
.fold:active,.reqb:active{transform:scale(.97)}
.reqb{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border-radius:20px;padding:14px;margin:4px 0 10px;border:1.5px dashed var(--glass-brd)}
.reqb .ic{font-size:26px}
.reqb .nm{font-weight:600;font-size:16px}
.reqb .sub{font-size:13px;color:var(--muted)}
.row .nm,.item .nm{font-weight:600;font-size:17px}
.row .sub,.item .sub{font-size:13px;color:var(--muted)}
.row .grow,.item .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--chip);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sc);border-radius:6px}
.row .bar i{transform-origin:right;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.lock.ok{background:var(--good-bg);color:var(--accent)}
.lock{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-bg);border-radius:8px;padding:2px 8px;white-space:nowrap}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 8px;padding:12px 14px;border-radius:20px;box-shadow:var(--glass-sh)}
.sw{width:52px;height:32px;border-radius:32px;border:0;background:rgba(120,140,165,.35);position:relative;flex:none;overflow:visible;box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:26px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.28);transition:inset-inline-start .35s var(--spring),width .2s}
.sw[aria-checked="true"]{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot))}
.sw[aria-checked="true"]::after{inset-inline-start:23px}
.sw:active::after{width:32px}
.sw[aria-checked="true"]:active::after{inset-inline-start:17px}
.note{font-size:13px;color:var(--muted);margin-top:24px}
.note button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;overflow:visible}
.empty{border-radius:20px;border-style:dashed;padding:20px 16px;text-align:center;color:var(--muted);margin:12px 0}
.empty .btn{margin-top:8px}
/* study */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sbar .back{border-radius:16px;min-width:44px;width:auto;height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;flex:none;box-shadow:var(--glass-sh);order:9}
.sbar .back .ba{display:inline-flex;line-height:1}
.sbar .back .ba .ic{width:22px;height:22px}
.prog{flex:1}
.prog .bar{margin-top:0;height:8px}
.prog .bar i{background:linear-gradient(90deg,var(--btn-bot),var(--btn-top));transition:width .5s}
.tbar{height:4px;background:transparent;margin-bottom:12px;border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:right}
.scene{perspective:1400px}
.card{display:grid;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--glass-brd);border-top:8px solid var(--sc);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.card:not(.flipped) .face.back,.card.flipped .face.front{visibility:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:1px 12px;background:var(--chip);color:var(--muted)}
.tag.s{background:var(--sc);color:#fff}
.q{font-size:var(--qfs,21px);font-weight:600;line-height:1.7;margin:0 0 16px;unicode-bidi:plaintext}
.qimg{display:block;max-width:100%;max-height:min(60vh,420px);margin:0 auto 16px;border-radius:12px;object-fit:contain;background:#fff;cursor:zoom-in}
.zoomv{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.zoomv img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.opts{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1px solid var(--fbrd);background:var(--field);border-radius:16px;padding:10px 12px;min-height:50px}
.opt:active{transform:scale(.97)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fbrd);display:grid;place-items:center;font-weight:600;font-size:14px}
.opt .t{unicode-bidi:plaintext;flex:1}
.opt{position:relative;overflow:hidden}
.opt.hasp::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--pw,0%);background:var(--chip);z-index:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.opt.hasp>*{position:relative;z-index:1}
.opt .pc{margin-inline-start:auto;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.chs{font-size:13px;color:var(--muted);margin:-4px 0 12px}
mark{background:var(--gold-bg);color:inherit;border-radius:4px;padding:0 2px}
.opt.good{background:var(--good-bg);border-color:var(--accent);animation:pop .45s var(--spring)}
.opt.good .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .4s}
.opt.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
@keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.res{font-weight:700;font-size:18px;margin:0 0 12px}
.res.ok{color:var(--accent)} .res.no{color:var(--bad)} .res.mid{color:var(--muted)}
.exp{background:var(--chip);border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:16px;unicode-bidi:plaintext}
.hlt{white-space:pre-wrap}
mark.hl{background:rgba(255,214,0,.5);color:inherit;border-radius:4px;padding:0 1px;cursor:pointer}
.ntbox{background:var(--chip);border-radius:16px;padding:12px 14px;margin:0 0 10px;font-size:calc(var(--qfs,21px)*.78);border-inline-start:5px solid var(--gold);unicode-bidi:plaintext}
.ntbox b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px;font-weight:600}
.qtools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 16px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:6px 0;border-radius:14px;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);color:var(--ink);font-size:10.5px;font-weight:600}
.tb .i{font-size:19px;line-height:1}
.tb.on{border-color:#E0A100;color:var(--gold);background:var(--gold-bg)}
.exp b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px;font-weight:600}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.sum{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-brd);border-radius:28px;padding:24px 18px;box-shadow:var(--glass-sh);text-align:center;animation:rise .5s var(--spring)}
.sum .big{font-size:56px;font-weight:700;line-height:1.2}
.sum p{margin:6px 0 16px;color:var(--muted)}
.sum .btn{margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
.gate{background:var(--gold-bg);color:var(--gold);border-radius:16px;padding:12px;margin:16px 0;font-weight:500;text-align:start}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,22,44,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .25s}
.sheet{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--glass-brd);border-bottom:0;width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:26px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:0 -20px 60px -20px rgba(10,40,100,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:up .5s cubic-bezier(.2,.9,.25,1.05)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:5px;background:var(--muted);opacity:.35}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 12px;font-size:22px}
.price{display:flex;align-items:baseline;gap:6px;margin:12px 0}
.price b{font-size:36px}
.sheet ul{padding-inline-start:20px;margin:8px 0 16px}
.pay{font-size:14px;color:var(--muted);margin-bottom:16px}
.code{display:flex;gap:8px;margin-top:8px}
.code input{flex:1;min-width:0;border:1px solid var(--fbrd);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;direction:ltr;text-align:center;letter-spacing:1px;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:6px 0 0}
.x{float:inline-end;border-radius:50%;width:40px;height:40px;font-size:18px}
/* admin */
.banner{font-size:13px;border-radius:14px;padding:8px 12px;margin-bottom:12px;background:var(--gold-bg);color:var(--gold)}
.banner.ok{background:var(--good-bg);color:var(--accent)}
.item .qt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
.item .acts2{display:flex;flex-direction:column;gap:6px;flex:none}
.ib{border-radius:12px;padding:4px 12px;min-height:40px;font-size:14px;font-weight:600}

.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.in{width:100%;border:1px solid var(--fbrd);background:var(--field);color:var(--ink);border-radius:14px;padding:10px 12px;font:inherit;unicode-bidi:plaintext}

.r2{display:flex;gap:8px}.r2>*{flex:1;min-width:0}
.orow{display:flex;gap:10px;align-items:center;margin-bottom:8px}

.chk{display:flex;gap:10px;align-items:center;margin:4px 0 12px;font-weight:600}

.cols{display:flex;flex-wrap:wrap;gap:10px}
.cl{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 2px var(--fbrd),inset 0 1px 0 rgba(255,255,255,.5)}
.cl:active{transform:scale(.85)}
.cl[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.hint pre{background:var(--chip);border-radius:12px;padding:8px 12px;margin:6px 0 0;white-space:pre-wrap;font:inherit;unicode-bidi:plaintext}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;background:rgba(11,32,56,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;border:1px solid rgba(255,255,255,.18);padding:12px 16px;border-radius:18px;z-index:30;text-align:center;animation:rise .4s var(--spring)}

.face{position:relative}
.auth{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-brd);border-radius:28px;padding:20px 18px;box-shadow:var(--glass-sh);animation:rise .5s var(--spring)}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;overflow:visible;font-weight:600}
.seg button{padding:8px 2px;font-size:14px}
h3.sec{margin:20px 0 8px;font-size:17px}
.codebox{width:100%;min-height:120px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.5px}
.terms{font-size:15px;line-height:1.9}
.terms li{margin-bottom:6px}

.stats.tap{cursor:pointer;transition:transform .4s var(--spring)}
.stats.tap:active{transform:scale(.97)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.kpi{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--glass-sh);padding:12px 14px}
.kpi b{display:block;font-size:28px;line-height:1.3}
.kpi span{display:block;font-weight:600;font-size:14px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:20px;box-shadow:var(--glass-sh);padding:12px 12px 8px}
.chart{display:flex;align-items:stretch;gap:6px;height:150px}
.chart.dense{gap:2px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.chart .val{font-size:11px;font-weight:600;color:var(--muted);min-height:16px}
.chart .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bw i{display:block;width:70%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));opacity:.55;transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
.chart.dense .bw i{width:80%;max-width:12px;border-radius:4px 4px 2px 2px}
.chart .col.today .bw i{opacity:1}
.chart em{font-style:normal;font-size:11px;color:var(--muted);min-height:18px;line-height:18px;white-space:nowrap}
@keyframes growY{from{transform:scaleY(0)}}
.rep{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:8px 2px;font-size:13px;border-bottom:1px solid var(--glass-brd)}
.rep:last-child{border-bottom:0}
.rep span:first-child{font-weight:600}

.ov{touch-action:none;overscroll-behavior:contain}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-height:92vh;max-height:92dvh}
.wa{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:10px 12px;margin:0 0 12px}
.wa span{font-size:13px;color:var(--muted)}
.wa b{flex:1;font-size:20px;letter-spacing:.5px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin:0 0 12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3px}

.star{background:none;border:0;font-size:24px;line-height:1;padding:0 6px;color:var(--muted);margin-inline-start:auto;overflow:visible;min-height:32px}
.star.on{color:#E0A100}
.seg button small{font-size:11px;opacity:.75;margin-inline-start:3px}
.opt.sel{border-color:var(--accent);background:var(--good-bg)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.wait{opacity:.65;pointer-events:none}
.revload{text-align:center;color:var(--muted);font-weight:600;font-size:14px;margin:12px 0 0;animation:rvp 1.1s ease-in-out infinite}
@keyframes rvp{50%{opacity:.4}}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:14px}
.pal button{min-height:40px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass);font-weight:600;font-size:14px;padding:0}
.pal button.done{background:var(--good-bg);border-color:var(--accent)}
.pal button.curr{outline:2px solid var(--accent)}
.xtm{font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.xtm.low{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.xfin{min-height:40px;padding:6px 14px}
.ans{margin:0 0 12px}
.ans>b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.rv{margin-bottom:12px}
.rv h4{margin:0 0 8px;font-size:15px;color:var(--muted)}
.rv .miss{font-size:13px;color:var(--bad);font-weight:600;margin:0 0 8px}

.goal{display:flex;align-items:center;gap:14px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:var(--glass-sh);padding:12px 16px;margin-bottom:12px;cursor:pointer;transition:transform .4s var(--spring)}
.dq{display:flex;align-items:center;gap:14px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:var(--glass-sh);padding:12px 16px;margin-bottom:12px;cursor:pointer;transition:transform .4s var(--spring);border-inline-start:6px solid var(--gold)}
.dq:active{transform:scale(.97)}
.dq .dqi{font-size:34px;line-height:1;flex:none}
.dq .gt{flex:1;min-width:0}
.dq .gt b{display:block;font-size:17px;line-height:1.4}
.dq .gt span{display:block;font-weight:600}
.dq .gt small{display:block;font-size:13px;color:var(--muted)}
.dqsq{font-size:44px;letter-spacing:4px;line-height:1.3;margin:4px 0 8px;direction:ltr}
.dqtext{white-space:pre-wrap;word-break:break-word;background:var(--chip);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:15px;text-align:center;unicode-bidi:plaintext}
.goal:active{transform:scale(.97)}
.goal svg{flex:none}
.goal circle+circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.goal .gt b{display:block;font-size:17px;line-height:1.4}
.goal .gt span{display:block;font-weight:600}
.goal .gt small{display:block;font-size:13px;color:var(--muted)}
.inst{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--gold-bg);color:var(--gold);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.inst>div{display:flex;gap:8px;align-items:center}
.seg-title{margin:16px 2px 0}
.seg-title b{display:block;font-size:15px;line-height:1.5}
.seg-title small{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.seg-title+.seg{margin-top:8px}

.ann{display:flex;align-items:flex-start;gap:10px;background:var(--good-bg);color:var(--accent);border:1px solid var(--glass-brd);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-weight:600;line-height:1.7}
.ann span{flex:1}
.ann.sp{background:var(--surface);color:var(--ink);border-color:var(--accent)}
.ann .adrow{flex:1;display:flex;gap:12px;align-items:flex-start;min-width:0}
.ann .adimg{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#fff}
.ann .adtx{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.ann .adlbl{font-size:11px;color:var(--muted);font-weight:600}
.ann .adgo{min-height:38px;padding:6px 18px;align-self:flex-start}
.annx{background:none;border:0;font-size:16px;line-height:1;padding:6px;color:inherit;opacity:.7;overflow:visible}
.rlink{display:block;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0;margin-bottom:6px;overflow:visible}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bd{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:var(--glass-sh);padding:12px;text-align:center;opacity:.55}
.bd.on{opacity:1}
.bd .bg{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--chip);color:var(--muted)}
.bd.on .bg{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:#fff}
.bd b{display:block;font-size:14px;line-height:1.4}
.bd small{display:block;font-size:12px;color:var(--muted);line-height:1.4}

:root[data-fs="s"]{--qfs:18px}
:root[data-fs="l"]{--qfs:24px}
:root[data-fs="xl"]{--qfs:28px}
.opt .t,.exp{font-size:calc(var(--qfs,21px)*.78)}
.setting.col{flex-direction:column;align-items:stretch;gap:6px}
.setting.col .seg{margin:0}
.rate{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:6px}
.rb{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;padding:8px 4px;min-height:60px;line-height:1.3}
.rb small{display:block;font-size:11px;opacity:.85;font-weight:500}
.rb.g1{background:var(--bad-bg);color:var(--bad);border:1px solid rgba(185,58,50,.25);box-shadow:none}
.rb.g2{background:var(--glass);color:var(--ink);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh)}
.rb.g4{background:var(--good-bg);color:var(--accent);border:1px solid var(--accent);box-shadow:none}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--good-bg);color:var(--accent);border:1px solid var(--accent);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.resume>div{display:flex;gap:8px;align-items:center}
.lbr .rk{min-width:28px;text-align:center;font-size:18px}
.lbr.me{outline:2px solid var(--accent)}

.aibtn{margin:0 0 8px}
.aibtns .btn{font-size:14px;padding:10px 6px;line-height:1.4}
.chl{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:0 0 8px}
.chb{padding:10px 12px;border-radius:16px;max-width:92%;font-size:15px;line-height:1.75;white-space:pre-wrap;unicode-bidi:plaintext}
.chb.u{align-self:flex-start;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));color:#fff}
.chb.m{align-self:flex-end;background:var(--chip)}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:8px}
.chin{display:flex;gap:8px;align-items:flex-end}
.chin textarea{flex:1;min-height:48px;max-height:120px}
.aibtn:disabled{opacity:.6}
.lockmini{font-size:11px;background:var(--gold-bg);color:var(--gold);border-radius:8px;padding:0 6px;margin-inline-start:8px}
.aibox{background:var(--chip);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 14px;margin:0 0 10px;font-size:calc(var(--qfs,21px)*.78);line-height:1.85}
.aibox[hidden]{display:none}
.aihead{font-weight:700;color:var(--accent);margin-bottom:6px;font-size:15px}

.brandrow{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.bmark{width:38px;height:38px;object-fit:contain;flex:none}
.logoplate{background:#fff;border-radius:26px;padding:14px 20px;display:flex;justify-content:center;box-shadow:var(--glass-sh);margin:0 auto 14px;width:max-content;max-width:100%}
.splash{display:grid;place-items:center;gap:6px;padding-top:12vh;text-align:center}

/* ===== تحسينات الواجهة ===== */
.ic{width:22px;height:22px;flex:none;display:block}
.top{align-items:flex-start}
.top .brand{min-width:0}
.top .grp{flex:none}
.pill.icn{width:44px;height:44px;min-height:44px;padding:0;display:grid;place-items:center;color:var(--ink)}
.pill.icn .ic{width:21px;height:21px}
.pill.wi{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.pill.wi .ic{width:18px;height:18px}
/* لوحة اليوم: الهدف والأرقام وزر البدء في مكان واحد أعلى الصفحة */
.hero{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-brd);border-radius:28px;box-shadow:var(--glass-sh);padding:16px 16px 16px;margin-bottom:14px}
.hero .goal{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:16px;padding:0 0 14px;margin:0}
.hero .goal .gt b{font-size:15px;color:var(--muted);font-weight:600}
.hero .goal .gt span{font-size:21px;font-weight:700;line-height:1.4}
.hero .stats{background:var(--chip);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:18px;margin:0 0 14px}
.hero .stat b{font-size:22px}
.hero .stat span{font-size:12.5px}
.hero .stat+.stat{border-inline-start:1px solid var(--line)}
.hero #go{min-height:56px;font-size:17px;border-radius:18px}
.hero+.btn.line{margin-top:0!important;margin-bottom:12px}
.sech{font-size:15px;font-weight:700;color:var(--muted);margin:22px 4px 10px}
/* بطاقات اليوم (التحدي، الامتحان الحي، الموعد، الشريك) بلا الحافة الملونة السميكة */
.dq{border-inline-start:1px solid var(--glass-brd);padding:12px 14px;gap:12px}
.dq .dqi,.amb .dqi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--gold-bg);flex:none}
.dq .gt b{font-size:16px}
.dq .gt span{font-size:14.5px}
.dq .pill{flex:none}
.amb{display:flex;align-items:flex-start;gap:12px;background:var(--gold-bg);color:var(--ink);border:1px solid var(--glass-brd);border-radius:22px;padding:14px;margin:14px 0 4px}
.amb .gt{flex:1;min-width:0}
.amb .gt>b{display:block;font-size:16px;line-height:1.5;color:var(--gold)}
.amb p{margin:4px 0 10px;font-size:14px;line-height:1.8}
.amb .ambb{display:flex;gap:8px;flex-wrap:wrap}
.amb .dqi{background:var(--surface)}
/* الاختصاصات والمواد: مربع لوني بأول حرف بدل الحافة الملونة */
.row{border-inline-start:1px solid var(--glass-brd)}
.cov.ph{display:grid;place-items:center;background:var(--sc);color:#fff;font-weight:700;font-size:24px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.row .bar,.item .bar{height:5px}
.fold{border-top:1px solid var(--glass-brd)}
.fold .ic2{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sc);color:#fff;margin-bottom:6px}
.fold .ic2 .ic{width:21px;height:21px}
/* الأزرار السريعة */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 0}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 4px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);font-size:13px;font-weight:600;line-height:1.35;text-align:center;color:var(--ink)}
.qa .ib2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--accent)}
.qa:active{transform:scale(.93)}
.btn.wi{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.wi .ic{width:20px;height:20px}
/* شريط أدوات السؤال: شريط واحد هادئ بدل ستة أزرار ثقيلة */
.qtools{gap:2px;background:var(--chip);border-radius:16px;padding:3px}
.tb{background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;min-height:50px;border-radius:13px;color:var(--muted);font-size:11px;gap:3px}
.tb .i{display:block;line-height:0}
.tb .ic{width:20px;height:20px}
.tb:active{transform:scale(.9);background:var(--glass)}
.tb.on{border:0;color:var(--gold);background:var(--gold-bg)}
.tb.on[data-tb="star"] .ic{fill:currentColor}
/* علامة صح وخطأ داخل دائرة الحرف */
.opt.good .l,.opt.bad .l{font-size:0}
.opt.good .l::before{content:"✓";font-size:17px;font-weight:700}
.opt.bad .l::before{content:"✕";font-size:15px;font-weight:700}
.res{display:flex;align-items:center;gap:8px}
/* نافذة اختيار نوع المراجعة */
.btn[data-mc]{min-height:60px}
.btn[data-mc][disabled]{opacity:.45}
/* الإعدادات */
.sheet .setting{margin:10px 0 0}
.acct{margin:18px 0 0;padding:12px 14px;border-radius:18px;background:var(--chip);font-size:14px;color:var(--muted);line-height:1.8}
.acct b{color:var(--ink)}
.acct .btn{margin-top:10px}
/* ripple */
.rp{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);transform:scale(0);animation:rp .65s ease-out forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* ---------- حركات الظهور (مستوحاة من فيديو التصميم) ---------- */
@keyframes bcIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes bcRing{from{stroke-dashoffset:163.4}}
@keyframes bcCheck{from{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.25) rotate(8deg)}}
.hm{display:none}
.hm.an~.top{animation:bcIn .5s var(--spring) backwards}
.hm.an~.hero{animation:bcIn .7s cubic-bezier(.2,.8,.2,1) .05s backwards}
.hm.an~.hero .goal{animation:bcIn .6s cubic-bezier(.2,.8,.2,1) .12s backwards}
.hm.an~.hero .goal circle+circle{animation:bcRing 1.3s cubic-bezier(.2,.8,.2,1) .25s backwards}
.hm.an~.hero .stat{animation:bcIn .6s cubic-bezier(.2,.8,.2,1) backwards}
.hm.an~.hero .stat:nth-child(1){animation-delay:.22s}
.hm.an~.hero .stat:nth-child(2){animation-delay:.3s}
.hm.an~.hero .stat:nth-child(3){animation-delay:.38s}
.hm.an~.hero #go{animation:bcIn .6s cubic-bezier(.2,.8,.2,1) .42s backwards}

async function cacheGetMany(st,keys){

  return new Promise(res=>{

    try{
      if(!keys.length){res(out);return}
      const t=db.transaction(st),os=t.objectStore(st);
      keys.forEach((k,i)=>{const g=os.get(k);g.onsuccess=()=>{out[i]=g.result||null}});
      t.oncomplete=()=>res(out);t.onerror=()=>res(out);t.onabort=()=>res(out);
    }catch(e){res(out)}
  });
}

const HY={denied:0,left:null};
async function hydrate(ents,onFetch){
  HY.denied=0;
  const owner=ownerKey();
  const uOf=e=>e.u||(Store.idx[e.id]||{}).u||0;
  const good=(c,e)=>!!c&&Array.isArray(c.o)&&(!uOf(e)||!c.u||c.u===uOf(e));
  let need=ents.filter(e=>!good(Store.qmap[e.id],e));
  if(need.length){
    if(onFetch)onFetch();
    const recs=await cacheGetMany('qc',need.map(e=>owner+'|'+e.id));
    need=need.filter((e,i)=>{const c=recs[i]&&recs[i].q;if(good(c,e)){Store.qmap[c.id]=c;return false}return true});
  }
  const ids=Array.from(new Set(need.map(e=>e.id)));
  for(let i=0;i<ids.length;i+=60){
    const r=await sb.rpc('q_fetch',{p_ids:ids.slice(i,i+60)});
    if(r.error){srvErr(r.error);throw r.error}
    const d=r.data||{},rows=d.rows||[];
    cachePutMany('qc',rows.map(q=>({k:owner+'|'+q.id,q:Object.assign({},q)})));   // نسخة بلا جواب ولا شرح
    rows.forEach(q=>{Store.qmap[q.id]=q});
    HY.denied+=(+d.denied||0);if(d.left!=null)HY.left=d.left;
  }
  return ents.map(e=>Store.qmap[e.id]).filter(c=>c&&Array.isArray(c.o));
}

const SRV_REC={};
async function qReveal(c,opt,first,ctx){
  if(typeof c.a==='number'&&!first)return c;
  const args={p_id:c.id,p_opt:(opt==null||opt<0)?null:opt,p_first:!!first,p_ctx:ctx||null};
  let r=await sb.rpc('q_answer',args);

    else if(!f.error&&f.data&&f.data.denied){const e=new Error('quota');e.quota=true;throw e}
  }
  if(r.error){srvErr(r.error);throw r.error}
  const d=r.data||{};
  if(typeof d.a!=='number')throw new Error('bad_answer');
  c.a=d.a;c.e=d.e||'';c._ch=d.ch||null;
  if(args.p_first&&args.p_opt!=null&&Store.user)SRV_REC[c.id]=1;   // السيرفر سجّل إحصائية الإجابة الأولى مع الجواب
  return c;
}

const cm=n=>Number(n).toLocaleString('en');
const noMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function animNum(el,to,o){
  o=o||{};const dur=o.dur||1200,dl=o.delay||0,suf=o.suf||'',f=o.cm?cm:String;
  if(!el)return;
  const fin=()=>{el.textContent=ar(f(to))+suf};
  if(noMotion()||!(to>0)){fin();return}
  el.textContent=ar(f(0))+suf;
  const t0=performance.now()+dl;
  const step=t=>{
    if(!el.isConnected)return;
    const p=Math.min(1,Math.max(0,(t-t0)/dur)),e=1-Math.pow(1-p,3);
    el.textContent=ar(f(Math.round(to*e)))+suf;
    if(p<1)requestAnimationFrame(step);else fin();
  };
  requestAnimationFrame(step);
}

const _home0=home;
home=function(){
  const a=document.getElementById('app'),sy=window.scrollY||0;
  let key=null,y0=0;
  const docTop=e=>{let y=0;while(e){y+=e.offsetTop;e=e.offsetParent}return y};
  const sel='.row,.fold,.reqb,.item,.sech';
  const kOf=e=>e.tagName+'|'+(e.textContent||'').replace(/\s+/g,' ').trim().slice(0,60);
  if(a&&sy>40&&view==='home'&&a.querySelector(':scope>.hm')){
    try{
      const el=[...a.querySelectorAll(sel)].find(e=>{const r=e.getBoundingClientRect();return r.top>=0&&r.top<window.innerHeight*0.85});
      if(el){key=kOf(el);y0=docTop(el)}
    }catch(e){key=null}
  }
  const r=_home0.apply(this,arguments);
  if(key!==null){
    try{
      const el2=[...a.querySelectorAll(sel)].find(e=>kOf(e)===key);
      if(el2){const d=docTop(el2)-y0;if(Math.abs(d)>1)window.scrollBy(0,d)}
    }catch(e){}
  }
  return r;
};
let _rvIO=null;
function scrollReveal(a){
  if(_rvIO){_rvIO.disconnect();_rvIO=null}
  if(!('IntersectionObserver' in window))return;
  const vh=window.innerHeight||document.documentElement.clientHeight||0;
  const late=[...a.querySelectorAll('.hm~.row,.hm~.folds .fold,.hm~.reqb')].filter(el=>el.getBoundingClientRect().top>vh+4);
  if(!late.length)return;
  late.forEach(el=>el.classList.add('sr'));
  _rvIO=new IntersectionObserver(es=>{
    let k=0;
    es.filter(e=>e.isIntersecting).sort((x,y)=>x.boundingClientRect.top-y.boundingClientRect.top).forEach(e=>{
      _rvIO.unobserve(e.target);
      e.target.style.setProperty('--sd',(k++*150)+'ms');
      e.target.classList.add('sr-in');
    });
  },{threshold:0,rootMargin:'0px 0px -3% 0px'});
  late.forEach(el=>_rvIO.observe(el));
}

}

function mergeProgress(R){
  const L=S,le=L.ep||0,re=R.ep||0;
  if(re>le){PSYNC.forEach(k=>{if(R[k]!==undefined)L[k]=R[k]})}          // تم تصفير التقدم من جهاز آخر
  else if(le>re){/* التصفير المحلي أحدث: نتجاهل النسخة السحابية */}
  else{
    const rc=R.cards||{},cards=Object.assign({},L.cards);
    Object.keys(rc).forEach(id=>{const a=cards[id],b=rc[id];if(!a||(b.lr||0)>(a.lr||0)||((b.lr||0)===(a.lr||0)&&(b.rp||0)>(a.rp||0)))cards[id]=b});
    const sd=Object.assign({},L.starDel||{});Object.keys(R.starDel||{}).forEach(id=>{sd[id]=Math.max(sd[id]||0,R.starDel[id])});
    const st=Object.assign({},L.starred),rs=R.starred||{};
    Object.keys(rs).forEach(id=>{if(!st[id]||(rs[id].t||0)>(st[id].t||0))st[id]=rs[id]});
    Object.keys(st).forEach(id=>{if((sd[id]||0)>(st[id].t||0))delete st[id];else delete sd[id]});
    const days=Object.assign({},L.days);
    Object.keys(R.days||{}).forEach(k=>{const a=days[k],b=R.days[k];if(!a||(b.n||0)>(a.n||0))days[k]=b});
    const em={};(L.exams||[]).concat(R.exams||[]).forEach(e=>{em[e.t]=e});
    const exams=Object.values(em).sort((a,b)=>b.t-a.t).slice(0,50);
    const badges=Object.assign({},L.badges);
    Object.keys(R.badges||{}).forEach(k=>{if(!badges[k]||R.badges[k]<badges[k])badges[k]=R.badges[k]});
    const newer=(R.pu||0)>(L.pu||0);
    ['goal','freezes','fzMs','newLimit'].forEach(k=>{if(newer&&R[k]!==undefined)L[k]=R[k]});
    L.frozen=Object.assign({},L.frozen,R.frozen);
    const a=L.newDay,b=R.newDay;
    if(b&&(!a||b.d>a.d||(b.d===a.d&&(b.n>a.n||b.x>a.x))))L.newDay=a&&a.d===b.d?{d:b.d,n:Math.max(a.n,b.n),x:Math.max(a.x||0,b.x||0)}:b;
    L.total=Math.max(L.total||0,R.total||0);
    const dq=Object.assign({},L.dq);Object.keys(R.dq||{}).forEach(k=>{const a=dq[k],b=R.dq[k];if(!b)return;if(!a||(b.done&&!a.done)||(!!b.done===!!a.done&&(b.r||[]).length>(a.r||[]).length))dq[k]=b});

  }
  if(!S.cards)S.cards={};if(!S.starred)S.starred={};if(!S.starDel)S.starDel={};if(!S.days)S.days={};if(!S.exams)S.exams=[];if(!S.badges)S.badges={};if(!S.frozen)S.frozen={};if(!S.dq)S.dq={};if(!S.exd)S.exd={};
  S.pu=Math.max(L.pu||0,R.pu||0);
}

const DQ_N=5,DQ_MIN=5,DQ_SLOW=45;

const dqDay=()=>new Date(Date.now()+3*36e5).toISOString().slice(0,10);   // اليوم بتوقيت العراق ليكون موحداً للجميع
const dqSqr=g=>g==='g'?'🟩':g==='y'?'🟨':'🟥';

function dqUrl(sp){return ((window.location&&location.origin)||'')+(((window.location&&location.pathname)||'').replace(/[^/]*$/,''))+'#dq-'+sp}
function dqHash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;h^=h>>>15;return h>>>0}
// احتياطي إذا لم تُضف دالة السيرفر: يسحب من الأسئلة المجانية فقط، بترتيب ثابت يعتمد على التاريخ والاختصاص
function dqPick(sp,day){
  const pool=Object.values(Store.qmap).filter(c=>c.free&&qSp(c)===sp&&Array.isArray(c.o)&&c.o.length>1);
  if(pool.length<DQ_MIN)return null;
  const ranked=pool.map(c=>({c:c,h:dqHash(day+'|'+sp+'|'+c.id)})).sort((a,b)=>a.h-b.h||String(a.c.id).localeCompare(String(b.c.id)));
  const out=[],used={};
  ranked.forEach(r=>{if(out.length<DQ_N&&!used[r.c.s]){used[r.c.s]=1;out.push(r.c)}});
  ranked.forEach(r=>{if(out.length<DQ_N&&!out.includes(r.c))out.push(r.c)});
  return out;
}

const loadingScreen=m=>{app.innerHTML=`<div class="top"><div class="brand">${brandHtml()}</div></div><p class="empty">${m}</p>`};
const cdTxt=ms=>{const t=Math.max(0,Math.floor(ms/1000)),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60);return (d?ar(d)+' يوم ':'')+ar(pad2(h)+':'+pad2(m)+':'+pad2(t%60))};
const dataRow=d=>Array.isArray(d)?d[0]:d;
const kb=f=>e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}};
const baseUrl=()=>((window.location&&location.origin)||'')+(((window.location&&location.pathname)||'').replace(/[^/]*$/,''));
function pickSpec(title,list,cb){
  if(!list.length)return false;
  if(list.length===1){cb(list[0]);return true}
  showModal(`<button class="x" id="cl" aria-label="إغلاق">✕</button><h2>${esc(title)}</h2>`+list.map(id=>`<button class="btn line block" data-pk="${esc(id)}" style="margin-top:8px"><b>${esc(spById(id).n)}</b></button>`).join(''));
  $('cl').onclick=closeModal;
  modal.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{const id=b.dataset.pk;closeModal();cb(id)});
  return true;
}
const shareRow=id=>`<div class="r2" style="margin-top:8px"><button class="btn" id="${id}sh">مشاركة</button><button class="btn line" id="${id}wa">واتساب</button><button class="btn line" id="${id}tg">تيليجرام</button></div>`;
function bindShareRow(id,txt,url,body){
  $(id+'sh').onclick=async()=>{try{if(navigator.share){await navigator.share({text:txt});return}}catch(x){if(x&&x.name==='AbortError')return}dqCopy(txt)};
  $(id+'wa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank','noopener');
  $(id+'tg').onclick=()=>window.open('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(body),'_blank','noopener');
}
const msgOf=(e,map)=>{const m=(e&&e.message)||'';for(const k of Object.keys(map))if(m.indexOf(k)>=0)return map[k];return 'تعذر تنفيذ العملية. جرب مرة ثانية.'};

/* ---------- تحدي زميل (1 ضد 1، والزميل يلعب بدون حساب) ---------- */
function chStart(){
  if(!Store.user){toast('ميزة تحدي الزميل لمشتركي Boardcard. سجّل دخولك بحسابك.');return}
  const list=F.sp&&Store.subs[F.sp]?[F.sp]:Object.keys(Store.subs);
  if(!pickSpec('اختر اختصاص التحدي ⚔️',list,chMake))toast('ميزة التحدي متاحة للمشتركين.');
}
async function chMake(sp){
  loadingScreen('جارٍ تجهيز التحدي…');
  let r;try{r=await rpc('ch_create',{p_sp:sp,p_name:''})}catch(e){r={error:{}}}
  if(r.error||!r.data){toast(msgOf(r.error,{limit:'وصلت للحد اليومي من التحديات.',not_enough:'لا توجد أسئلة كافية لهذا الاختصاص.'}));home();return}
  chOpen(r.data,true);
}
async function chOpen(id,mine){
  stopTimer();loadingScreen('جارٍ تحميل التحدي…');
  let r;try{r=await rpc('ch_get',{p_id:id})}catch(e){r={error:{}}}
  const ch=r.data;
  if(r.error||!ch||!ch.questions||!ch.questions.length){toast('رابط التحدي غير صالح.');home();return}
  if(lsGet('bc_ch_'+ch.id)){chResult(ch);return}
  view='chintro';
  const spn=spById(ch.sp).n,best=(ch.results||[])[0],n=ch.questions.length;
  app.innerHTML=`<div class="top"><div class="brand">⚔️ تحدي زميل<small>${esc(spn)}</small></div><button class="pill" id="chh">رجوع</button></div>
  <div class="sum"><div class="big">⚔️</div>
  <p>${mine?'جهّز نفسك! حل الأسئلة ال'+ar(n)+' أولاً، ثم أرسل الرابط لزملائك ليتفوقوا عليك. زميلك يلعب بدون حساب.':'<b>'+esc(ch.creator_name)+'</b> تحداك بـ'+ar(n)+' أسئلة في '+esc(spn)+'.'+(best?' أعلى نتيجة حتى الآن: '+esc(best.name)+' '+ar(best.score)+'/'+ar(best.n)+'.':'')+' هل تقدر تتفوق عليه؟'}</p>
  ${Store.user?'':`<label class="fld"><span>اسمك</span><input class="in" id="chn" maxlength="20" dir="auto" value="${esc(lsGet('bc_pname')||'')}"></label>`}
  <button class="btn block" id="chgo">ابدأ التحدي</button></div>`;
  $('chh').onclick=home;
  $('chgo').onclick=()=>{
    let nm='';
    if(!Store.user){nm=($('chn').value||'').trim();if(nm.length<2){toast('اكتب اسمك (حرفان على الأقل).');return}lsSet('bc_pname',nm)}
    D={kind:'ch',label:'⚔️ تحدي زميل',sp:ch.sp,day:'',qs:ch.questions.map(memQ),cid:ch.id,i:0,r:[],s:[],pa:[],done:()=>chFinish(ch,nm)};
    dqShow();
  };
}
async function chFinish(ch,nm){
  const score=D.r.filter(g=>g!=='r').length,secs=D.s.reduce((t,x)=>t+x,0);
  lsSet('bc_ch_'+ch.id,JSON.stringify({score:score,secs:secs,name:nm||(Store.profile&&Store.profile.full_name?String(Store.profile.full_name).trim().split(' ')[0].slice(0,20):'')}));
  loadingScreen('جارٍ حفظ نتيجتك…');
  try{await rpc('ch_submit',{p_id:ch.id,p_player:pkey(),p_name:nm||'',p_answers:(D&&D.pa)||[],p_secs:secs})}catch(e){}
  ptFlush();
  chOpen(ch.id,false);
}
function chResult(ch){
  view='chres';stopTimer();
  let my={};try{my=JSON.parse(lsGet('bc_ch_'+ch.id)||'{}')||{}}catch(e){}
  const spn=spById(ch.sp).n,n=ch.questions.length,rows=ch.results||[];
  const isMe=r=>r.score===my.score&&r.secs===my.secs&&(!my.name||r.name===my.name);
  const cr=rows.find(r=>r.name===ch.creator_name&&!isMe(r))||rows.find(r=>!isMe(r));
  const url=baseUrl()+'#ch-'+ch.id;
  const body='⚔️ تحدّيتك في '+spn+' على Boardcard!\nحصلت على '+ar(my.score||0)+'/'+ar(n)+' خلال '+fmtT(my.secs||0)+'\nهل تقدر تتفوق عليّ؟';
  const verdict=cr?(my.score>cr.score?'🎉 تفوقت عليه!':my.score===cr.score?'تعادلتما، والوقت يحسم!':'قريب! جرب تحدياً آخر.'):'';
  app.innerHTML=`<div class="top"><div class="brand">⚔️ نتيجة التحدي<small>${esc(spn)}</small></div><button class="pill" id="chh">رجوع</button></div>
  <div class="sum"><div class="big"><bdi dir="ltr">${ar(my.score||0)} / ${ar(n)}</bdi></div>
  ${cr?`<p><b>${esc(cr.name)} ${ar(cr.score)}، أنت ${ar(my.score||0)}</b><br>${verdict}</p>`:'<p>أرسل الرابط لزملائك. حين يلعبون تظهر نتائجهم هنا.</p>'}
  ${rows.map((r,i)=>`<div class="item lbr${isMe(r)?' me':''}" style="--sc:${i===0?'#E0A100':'#5A6B77'}"><b class="rk">${ar(i+1)}</b><div class="grow"><div class="nm" dir="auto">${esc(r.name)}${isMe(r)?' (أنت)':''}</div><div class="sub">${fmtT(r.secs)}</div></div><b>${ar(r.score)}/${ar(r.n)}</b></div>`).join('')}
  ${shareRow('ch')}
  <button class="btn line block" id="chrf" style="margin-top:8px">تحديث النتائج</button>
  ${Store.user?'':'<button class="btn block" id="chtry" style="margin-top:8px">جرّب تحدي اليوم مجاناً</button>'}
  </div>`;
  $('chh').onclick=home;$('chrf').onclick=()=>chOpen(ch.id,false);
  const tr=$('chtry');if(tr)tr.onclick=()=>{home();dqChooser()};
  bindShareRow('ch',body+'\n'+url,url,body);
}

/* ---------- الامتحان الحي كل جمعة 8 مساءً (بتوقيت العراق) ---------- */
const LV={};
let LR=null,liveTick=null;
async function liveLoad(sp,force){
  const c=LV[sp];if(!force&&c&&Date.now()-c.at<60000)return c.info;
  try{const r=await rpc('live_info',{p_sp:sp,p_player:Store.user?null:pkey()});LV[sp]={info:r.data||null,at:Date.now(),off:r.data?Date.parse(r.data.now)-Date.now():0}}
  catch(e){LV[sp]={info:null,at:Date.now(),off:0}}
  return LV[sp].info;
}
const lvNow=sp=>Date.now()+((LV[sp]&&LV[sp].off)||0);
function liveCard(sp){
  const c=LV[sp],i=c&&c.info;if(!i)return '';
  const now=lvNow(sp),st=Date.parse(i.starts_at),je=st+i.join_mins*6e4;
  if(!F.sp&&!(now>=st-48*36e5&&now<st+4*36e5))return '';
  let line,btn;
  if(i.done){line='أنهيت الامتحان ✓';btn='النتيجة'}
  else if(i.begun&&now<je+i.minutes*6e4){line='امتحانك جارٍ، أكمله';btn='أكمل'}
  else if(now<st){line='يبدأ بعد '+fmtIv((st-now)/864e5)+' · الجمعة 8 مساءً';btn='تفاصيل'}
  else if(now<=je){line='بدأ الآن! ادخل قبل أن يُغلق الباب';btn='ادخل'}
  else{line='انتهى هذا الأسبوع. التالي الجمعة القادمة';btn='النتائج'}
  return `<div class="dq" data-lv="${esc(sp)}" role="button" tabindex="0"><div class="dqi">🔴</div><div class="gt"><b>امتحان الجمعة الحي · ${esc(spById(sp).n)}</b><span>${line}</span><small>${ar(i.n)} سؤالاً، ${ar(i.minutes)} دقيقة، ${ar(i.participants)} مشارك</small></div><span class="pill">${btn}</span></div>`;
}
function liveHtml(){
  if(F.sj)return '';
  const sps=F.sp?(Store.subs[F.sp]&&dqOk(F.sp)?[F.sp]:[]):Object.keys(Store.subs).filter(dqOk);
  if(sps.length)return sps.map(liveCard).join('');
  if(!F.sp&&!Store.user){const dw=new Date(Date.now()+3*36e5).getUTCDay();
    if(dw>=3&&dw<=5&&spList().some(p=>dqOk(p.id)))return `<div class="dq" data-lv="" role="button" tabindex="0"><div class="dqi">🔴</div><div class="gt"><b>امتحان الجمعة الحي</b><span>الجمعة 8 مساءً، الكل بنفس الوقت</span><small>مشاركتك الأولى مجانية</small></div><span class="pill">شارك</span></div>`}
  return '';
}
async function liveScreen(sp){
  view='live';stopTimer();clearInterval(liveTick);loadingScreen('جارٍ التحميل…');
  const info=await liveLoad(sp,true);
  if(!info){toast('لا يوجد امتحان حي لهذا الاختصاص حالياً.');home();return}
  renderLive(sp);
}
function renderLive(sp){
  view='live';clearInterval(liveTick);
  const i=LV[sp].info,now=lvNow(sp),st=Date.parse(i.starts_at),je=st+i.join_mins*6e4,spn=spById(sp).n;
  const head=`<div class="top"><div class="brand">🔴 امتحان الجمعة الحي<small>${esc(spn)}</small></div><button class="pill" id="lvb">رجوع</button></div>`;
  const rules=`<p class="hint">${ar(i.n)} سؤالاً، مدتها ${ar(i.minutes)} دقيقة. الدخول متاح ${ar(i.join_mins)} دقيقة من لحظة البدء، والكل بنفس الأسئلة والوقت. النتيجة والأجوبة والترتيب تظهر بعد انتهاء الامتحان للجميع.</p>`;
  const nameBox=Store.user?'':`<label class="fld"><span>اسمك في الترتيب</span><input class="in" id="lvn" maxlength="20" dir="auto" value="${esc(lsGet('bc_pname')||'')}"></label>`;
  let body='',after=null;
  const ea=i.ends_at?Date.parse(i.ends_at):je+(i.minutes+1)*6e4;
  if(i.done){
    if(now>=ea){body='<p>أنهيت هذا الامتحان.</p><button class="btn block" id="lvmine">عرض نتيجتي وأجوبتي</button><div id="lvboard" style="margin-top:10px"><p class="hint">جارٍ التحميل…</p></div>';after='board'}
    else{body='<p>أنهيت هذا الامتحان ✓</p><p class="hint">النتيجة والأجوبة والترتيب تظهر بعد انتهاء الامتحان لجميع المشاركين (بعد '+cdTxt(ea-now)+').</p>'}
  }
  else if(i.begun&&now<je+i.minutes*6e4){body=`<p>لديك امتحان قيد التنفيذ.</p><button class="btn block" id="lvgo">أكمل الامتحان</button>`}
  else if(now<st){body=`<div class="big" style="font-size:40px" id="lvcd">${cdTxt(st-now)}</div><p>يبدأ الجمعة 8 مساءً بتوقيت العراق</p>${rules}${Store.subs[sp]?'':'<p class="hint">مشاركتك الأولى مجانية، ثم يلزم اشتراك الاختصاص.</p>'}`;after='tick'}
  else if(now<=je){body=`<p>بدأ الامتحان! الباب يُغلق بعد <b id="lvcd">${cdTxt(je-now)}</b></p>${rules}${nameBox}<button class="btn block" id="lvgo">ابدأ الامتحان</button>`;after='tick'}
  else if(now<ea){body='<p>أُغلق باب الدخول، والامتحان ما زال جارياً لبعض المشاركين. تظهر النتائج والترتيب بعد انتهائه.</p>'}
  else{body='<p>انتهى امتحان هذا الأسبوع. الامتحان القادم الجمعة القادمة 8 مساءً.</p><div id="lvboard"><p class="hint">جارٍ تحميل النتائج…</p></div>';after='board'}
  app.innerHTML=head+`<div class="sum">${body}</div>`;
  $('lvb').onclick=home;
  const lm=$('lvmine');if(lm)lm.onclick=()=>liveMine(sp);
  const go=$('lvgo');if(go)go.onclick=()=>{let nm='';if(!Store.user){nm=($('lvn')?$('lvn').value:lsGet('bc_pname')||'').trim();if(!i.begun&&nm.length<2){toast('اكتب اسمك (حرفان على الأقل).');return}if(nm)lsSet('bc_pname',nm)}liveGo(sp,nm)};
  if(after==='board')liveBoard(sp,i.id,'lvboard');
  if(after==='tick'){const target=now<st?st:je;liveTick=setInterval(()=>{const el=$('lvcd');if(!el||view!=='live'){clearInterval(liveTick);return}const left=target-lvNow(sp);if(left<=0){clearInterval(liveTick);liveLoad(sp,true).then(()=>{if(view==='live')renderLive(sp)});return}el.textContent=cdTxt(left)},1000)}
}
async function liveBoard(sp,id,boxId,mine){
  let r;try{r=await rpc('live_board',{p_id:id,p_player:Store.user?null:pkey()})}catch(e){r={error:{}}}
  const box=$(boxId);if(!box)return;
  const d=r.data;
  if(d&&d.pending){box.innerHTML='<p class="hint">الترتيب يظهر بعد انتهاء الامتحان للجميع.</p>';return}
  if(r.error||!d){box.innerHTML='<p class="hint">تعذر تحميل الترتيب.</p>';return}
  const rows=d.rows||[],my=d.my;
  box.innerHTML=(my?`<p><b>ترتيبك ${ar(my.rnk)} من ${ar(d.total)}</b>${d.total>1?'، أفضل من '+ar(Math.round(100*(d.total-my.rnk)/d.total))+'% من المشاركين':''}</p>`:'')+
    (rows.length?rows.map(x=>`<div class="item lbr${x.me?' me':''}" style="--sc:${x.rnk<=3?['#E0A100','#9AA7B4','#B9783A'][x.rnk-1]:'#5A6B77'}"><b class="rk">${ar(x.rnk)}</b><div class="grow"><div class="nm" dir="auto">${esc(x.name)}${x.me?' (أنت)':''}</div><div class="sub">${fmtT(x.secs)}</div></div><b>${ar(x.score)}</b></div>`).join(''):'<p class="hint">لا توجد نتائج بعد.</p>')+
    '<button class="btn line block" id="lvrf" style="margin-top:8px">تحديث الترتيب</button>';
  const rf=$('lvrf');if(rf)rf.onclick=()=>liveBoard(sp,id,boxId,mine);
  if(mine)mine(my,d.total);
}
async function liveGo(sp,nm){
  const i=LV[sp].info;loadingScreen('جارٍ تجهيز الامتحان…');
  let r;try{r=await rpc('live_start',{p_id:i.id,p_player:pkey(),p_name:nm||''})}catch(e){r={error:{}}}
  if(r.error||!r.data){
    const m=(r.error&&r.error.message)||'';
    if(/subscribers_only/.test(m)){await liveLoad(sp,true);renderLive(sp);subscribeModal('استعملت مشاركتك المجانية. اشترك لتشارك في كل امتحانات الجمعة.');return}
    toast(msgOf(r.error,{closed:'أُغلق باب الدخول لهذا الأسبوع.',already_done:'شاركت بهذا الامتحان مسبقاً.',not_open:'لم يبدأ الامتحان بعد.',expired:'انتهى وقت امتحانك.'}));
    await liveLoad(sp,true);renderLive(sp);return;
  }
  const d=r.data,off=Date.parse(d.now)-Date.now();
  let ans=[];try{ans=JSON.parse(lsGet('bc_lv_'+i.id)||'[]')||[]}catch(e){}
  LR={sp:sp,i:i,qs:d.questions,ans:ans,k:0,end:Date.parse(d.begun_at)+d.minutes*6e4-off};
  liveShow();
}
function liveShow(){
  view='liverun';stopTimer();clearInterval(liveTick);
  const c=LR.qs[LR.k],n=LR.qs.length,sub=subjOf(c.s),left=Math.max(0,Math.round((LR.end-Date.now())/1000));
  app.innerHTML=`<div class="sbar"><span class="pill"><bdi dir="ltr">${ar(LR.k+1)} / ${ar(n)}</bdi></span><span class="pill xtm${left<=60?' low':''}" id="lvt">${mmss(left)}</span><button class="btn xfin" id="lvf">إنهاء</button></div>
  <div class="scene" style="--sc:${safeC(sub.c)}"><div class="card"><section class="face front" aria-label="السؤال">
    <div class="tags"><span class="tag s">🔴 امتحان حي</span><span class="tag">${esc(sub.n)}</span></div>
    <p class="q" dir="${dirOf(c.q)}">${fmt(c.q)}</p>${imgHtml(c)}
    <ul class="opts">${c.o.map((t,i)=>`<li><button class="opt${LR.ans[LR.k]===i?' sel':''}" dir="${dirOf(t)}" data-i="${i}"><span class="l">${LET[i]}</span><span class="t">${esc(t)}</span></button></li>`).join('')}</ul>
    <div class="r2"><button class="btn line" id="lvp"${LR.k?'':' disabled'}>السابق</button><button class="btn line" id="lvn2"${LR.k+1<n?'':' disabled'}>التالي</button></div>
  </section></div></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{LR.ans[LR.k]=+b.dataset.i;lsSet('bc_lv_'+LR.i.id,JSON.stringify(LR.ans));app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});
  $('lvp').onclick=()=>{LR.k--;liveShow()};$('lvn2').onclick=()=>{LR.k++;liveShow()};
  $('lvf').onclick=async()=>{const un=n-LR.ans.filter(x=>x!=null).length;if(await askConfirm('إنهاء الامتحان',un?'لديك '+ar(un)+' سؤالاً بدون إجابة. تنهي الامتحان؟':'هل تريد تسليم الامتحان؟','سلّم'))liveSubmit()};
  tId=setInterval(()=>{const l=Math.max(0,Math.round((LR.end-Date.now())/1000)),el=$('lvt');if(el){el.textContent=mmss(l);el.classList.toggle('low',l<=60)}if(l<=0){stopTimer();liveSubmit()}},1000);
}
async function liveSubmit(){
  stopTimer();const L=LR;if(!L)return;
  loadingScreen('جارٍ تسليم الامتحان…');
  const ans=L.qs.map((q,k)=>L.ans[k]==null?-1:L.ans[k]);
  let r;try{r=await rpc('live_submit',{p_id:L.i.id,p_player:pkey(),p_answers:ans})}catch(e){r={error:{}}}
  if(r.error||!r.data){toast(msgOf(r.error,{already_done:'سُلّم هذا الامتحان مسبقاً.',not_started:'لم يبدأ امتحانك.'}));await liveLoad(L.sp,true);renderLive(L.sp);return}
  const d=r.data;lsSet('bc_lv_'+L.i.id,'[]');lsSet('bc_lvans_'+L.i.id,JSON.stringify(ans));
  if(d.pending){await liveLoad(L.sp,true);liveWait(L,d);return}
  try{L.qs.forEach((q,k)=>{const rv=d.review.find(x=>x.id===q.id);dqRecord({id:q.id,s:q.s,sy:q.sy,ex:undefined},!!rv&&rv.a===ans[k],0)})}catch(e){}
  ptFlush();
  await liveLoad(L.sp,true);
  liveResult(L,d);
}
function liveWait(L,d){
  view='livewait';stopTimer();
  const spn=spById(L.sp).n,left=Math.max(0,Date.parse(d.ends_at)-lvNow(L.sp));

let PTN=null,PTat=0,ptBusy=false;
async function ptFlush(){

  try{const r=await rpc('mark_active',{p_n:n});if(!r.error){S.ptPend=Math.max(0,S.ptPend-n);save()}}catch(e){}

/* ---------- خريطة الإتقان لكل اختصاص ---------- */
function mapScreen(sp){
  view='map';stopTimer();
  const spn=spById(sp).n;
  let T=0,M=0,done=0,cnt=0,near=null;
  const row=(attr,name,st,c,indent)=>{
    const d=st.open,m=st.mastered,p=d?Math.min(100,Math.round(100*m/d)):0,fin=d>0&&m>=d;
    cnt++;if(fin)done++;
    if(d>0&&!fin&&(!near||d-m<near.left))near={name:name,left:d-m};
    return `<button class="item" ${attr} style="--sc:${safeC(c)};${indent?'margin-inline-start:16px;width:calc(100% - 16px)':''}"><div class="grow"><div class="nm">${esc(name)}${fin?' ✅':''}</div><div class="sub">${d?ar(m)+' من '+ar(d)+' · '+ar(p)+'%'+(fin?' · ختمتها!':' · باقي '+ar(d-m)):'🔒 للمشتركين'}</div><div class="bar"><i style="width:${p}%"></i></div></div></button>`;
  };
  const html=subjectsOf(sp).map(x=>{
    const st=stats({s:x.id});if(!st.total)return '';
    T+=st.open;M+=st.mastered;
    const sys=systemsOf(x.id).map(y=>({y:y,st:stats({s:x.id,sy:y.id})})).filter(z=>z.st.total);
    const g=stats({s:x.id,sy:'_none'});if(sys.length&&g.total)sys.push({y:{id:'_none',n:'أسئلة عامة',c:x.c},st:g});
    return row(`data-mp="${esc(x.id)}|"`,x.n,st,x.c,false)+sys.map(z=>row(`data-mp="${esc(x.id)}|${esc(z.y.id)}"`,z.y.n,z.st,z.y.c,true)).join('');
  }).join('');
  const P0=T?Math.round(100*M/T):0;
  app.innerHTML=`<div class="top"><div class="brand">🗺 خريطة الإتقان<small>${esc(spn)}</small></div><button class="pill" id="mpb">رجوع</button></div>
  <div class="sum"><div class="big">${ar(P0)}%</div><p>أتقنت ${ar(M)} من ${ar(T)} سؤالاً في ${esc(spn)}</p><div class="bar"><i style="width:${P0}%"></i></div>${near?`<p class="hint" style="margin-top:10px">الأقرب للختم: <b>${esc(near.name)}</b>، باقي ${ar(near.left)} سؤالاً فقط.</p>`:''}</div>
  <h3 class="sec">المواد والأنظمة</h3>${html||'<div class="empty">لا توجد أسئلة بعد.</div>'}
  <p class="note">«أتقنت» تعني أن السؤال وصل لمرحلة التثبيت الطويل في جدول المراجعة. اضغط على أي مادة أو نظام لتراجعه.</p>`;
  $('mpb').onclick=home;
  app.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{const [sid,sy]=b.dataset.mp.split('|');start(sid,sp,sy||undefined)});
}

    const d=S.days[dk(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i))];if(!d||!d.n)continue;
    act++;tot.n+=d.n;tot.ok+=d.ok;tot.sec+=d.sec;
    Object.keys(d.subj||{}).forEach(id=>{const a=agg[id]||(agg[id]={n:0,ok:0});a.n+=d.subj[id].n;a.ok+=d.subj[id].ok});
  }

  const best=Object.keys(agg).filter(id=>agg[id].n>=10&&Store.subjects.some(x=>x.id===id)).map(id=>({id:id,p:agg[id].ok/agg[id].n})).sort((a,b)=>b.p-a.p)[0];

async function customRun(groups){
  const all=[];groups.forEach(g=>g.subs.forEach(x=>all.push(x.id)));
  // مادة مؤشر عليها، أو مادة فيها نظام مؤشر عليه، تُعتبر مختارة
  const picked=new Set(all.filter(id=>CT.subj[id]||Object.keys(CT.sys).some(k=>CT.sys[k]&&k.split('|')[0]===id)));
  const ids=picked.size?Array.from(picked):all;
  closeModal();
  loadingScreen('جارٍ تحميل الأسئلة…');
  try{await ensureIndex(ids)}catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  const ySel=sid=>Object.keys(CT.sys).filter(k=>CT.sys[k]&&k.split('|')[0]===sid).map(k=>k.split('|')[1]);
  let pool=Object.values(Store.idx).filter(c=>{
    if(!ids.includes(c.s))return false;
    if(!(c.free||Store.subs[qSp(c)]||Store.isAdmin))return false;
    const ys=ySel(c.s);if(ys.length&&!ys.some(y=>inSys(c,y)))return false;
    const e=S.cards[c.id];
    if(CT.f==='new')return !e;
    if(CT.f==='missed')return !!e&&e.box===0;
    return true;
  });
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  pool=pool.slice(0,CT.n);
  if(!pool.length){toast(CT.f==='missed'?'ما عندك أسئلة خاطئة بهذا الاختيار. أحسنت!':CT.f==='new'?'حللت كل الأسئلة بهذا الاختيار.':'لا توجد أسئلة بهذا الاختيار.');home();return}
  let list;
  try{list=await hydrate(pool)}catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  if(!list.length){toast(HY.denied?QUOTA_MSG:'تعذر تحميل الأسئلة. جرب مرة ثانية.');home();return}
  if(HY.denied)toast('وصلت للحد اليومي من الأسئلة الجديدة، فالاختبار '+ar(list.length)+' سؤالاً فقط.');
  runSession(list,'custom');

let Q=[],qi=0,cur=null,answered=false,sess={},tId=null,tEnd=0,cardT=0,recT=0;
async function start(subj,sp,sy,o){
  const mode=(o&&o.mode)||F.mode||'smart';
  const subIds=Object.keys(Store.subs);
  const scoped=!subj&&!sp&&sy===undefined&&subIds.length>0&&(mode==='smart'||mode==='new');
  const showLoading=()=>{app.innerHTML=`<div class="top"><div class="brand">${brandHtml()}</div></div><p class="empty">جارٍ تحميل الأسئلة…</p>`};
  const mine=()=>{
    if(mode==='notes'){const set={};notedIds(sp).forEach(id=>{set[noteSubj(id)]=1});return Object.keys(set)}
    const src=mode==='saved'?S.starred:S.cards,set={};
    Object.keys(src).forEach(id=>{const e=src[id];if(e.s&&(mode==='saved'||e.box===0))set[e.s]=1});
    return Object.keys(set).filter(id=>Store.subjects.some(x=>x.id===id));
  };
  try{
    let ids=null;
    if(subj)ids=[subj];
    else if(sp)ids=subjectsOf(sp).map(x=>x.id);
    else if(scoped)ids=Store.subjects.filter(x=>subIds.includes(spOfSubj(x))).map(x=>x.id);
    else if(mode==='saved'||mode==='missed'||mode==='notes')ids=mine();
    if(ids)await ensureIndex(ids,showLoading);else await ensureFree(showLoading);
  }catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  // أسئلة منقولة إلى مادة أخرى: نحمّل فهارس المواد المتاحة للعثور عليها بدل أن تبدو الجلسة فارغة
  if(mode==='missed'||mode==='saved'){
    try{
      const src=mode==='saved'?S.starred:S.cards,sc1={ex:F.exam,s:subj||undefined,sp:sp||undefined};
      const lost=Object.keys(src).some(id=>{const e=src[id];return e&&e.s&&(mode==='saved'||e.box===0)&&grpIn(e,sc1)&&!Store.idx[id]});
      if(lost){
        const fr=freeSubjects();
        await ensureIndex(Store.subjects.filter(x=>Store.isAdmin||Store.subs[spOfSubj(x)]||fr.includes(x.id)).map(x=>x.id),showLoading);
      }
    }catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  }
  const now=Date.now();
  const inScope=Object.values(Store.idx).filter(c=>{
    if(scoped&&!subIds.includes(qSp(c)))return false;
    if(subj&&c.s!==subj)return false;
    if(sp&&qSp(c)!==sp)return false;
    if(sy!==undefined&&!inSys(c,sy))return false;
    if(F.exam!=='all'&&c.ex!==F.exam)return false;
    if(mode==='new')return !S.cards[c.id];
    if(mode==='missed'){const e=S.cards[c.id];return !!e&&e.box===0}
    if(mode==='saved')return !!S.starred[c.id];
    if(mode==='notes')return hasNoteC(c.id);
    return true;
  });
  // التكرار المتباعد: لا يظهر إلا السؤال الجديد أو الذي حان موعد مراجعته
  let pool=mode==='notes'?inScope.slice():inScope.filter(c=>isDueC(c.id,now));
  // حد الأسئلة الجديدة اليومي: المراجعات المستحقة لا تتأثر
  const remNew=newRemain();let limHit=false;
  if(mode!=='notes'){const olds=[],news=[];pool.forEach(c=>(S.cards[c.id]?olds:news).push(c));
   if(news.length>remNew){news.sort((a,b)=>(Number(a.t)||0)-(Number(b.t)||0));limHit=remNew===0;pool=olds.concat(news.slice(0,remNew))}}
  let nextDue=0;
  if(!pool.length)inScope.forEach(c=>{const e=S.cards[c.id];if(e&&e.due>now&&(!nextDue||e.due<nextDue))nextDue=e.due});
  const rank=c=>{const st=S.cards[c.id];if(!st)return 1;if(st.box===0)return 0;const R=st.sb?fR(Math.max(0,(now-st.lr)/864e5),st.sb):0.5;return 2+R};
  const byT=(a,b)=>(Number(a.t)||0)-(Number(b.t)||0);
  const sorted=mode==='notes'?pool.slice().sort((a,b)=>((N.q[b.id]||{}).u||0)-((N.q[a.id]||{}).u||0)):pool.slice().sort((a,b)=>mode==='new'?byT(a,b):(rank(a)-rank(b)||byT(a,b)));
  const capQ=mode==='notes'?50:10;
  // المراجعة التلقائية من الرئيسية: توزيع متساوٍ على الاختصاصات ثم على المواد داخل كل اختصاص، مع الحفاظ على أولوية الترتيب
  const balance=scoped&&(mode==='smart'||mode==='new');
  const balancedPick=list=>{
    const sps=[],spMap={};
    list.forEach(c=>{const k=qSp(c);let g=spMap[k];if(!g){g=spMap[k]={subs:[],m:{},i:0};sps.push(g)}let q=g.m[c.s];if(!q){q=g.m[c.s]=[];g.subs.push(q)}q.push(c)});
    const out=[];
    while(out.length<capQ){
      let any=false;
      for(const g of sps){
        if(out.length>=capQ)break;
        for(let t=0;t<g.subs.length;t++){
          const q=g.subs[(g.i+t)%g.subs.length];
          if(q.length){out.push(q.shift());g.i=(g.i+t+1)%g.subs.length;any=true;break}
        }
      }
      if(!any)break;
    }
    return out;
  };
  const pickQ=list=>balance?balancedPick(list):list.slice(0,capQ);
  // نص أسئلة هذه الجلسة فقط يُطلب من السيرفر
  let quota=false;
  Q=pickQ(sorted);
  if(Q.length){
    try{
      Q=await hydrate(Q,showLoading);
      if(HY.denied>0){   // انتهى حد اليوم من الأسئلة الجديدة عند السيرفر: تكمل الجلسة بالمراجعات المستحقة
        quota=true;
        Q=await hydrate(pickQ(sorted.filter(c=>S.cards[c.id]||Store.qmap[c.id])),showLoading);
      }
    }catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  }
  const st=stats({s:subj||undefined,sp:sp||undefined,sy:sy,ex:F.exam});
  sess={ok:0,n:0,sec:0,rq:{},locked:(scoped||mode==='saved'||mode==='missed'||mode==='notes')?0:st.locked,subj:subj,sp:sp,sy:sy,mode:mode,next:nextDue,lim:!Q.length&&limHit&&!quota,quota:!Q.length&&quota};
  qi=0;
  Q.length?showCard():summary();
}

function bindRate(){app.querySelectorAll('[data-g]').forEach(b=>{b.onclick=()=>rate(+b.dataset.g)})}
function rate(g){if(rated)return;rated=true;record(g>1,g,pendSec);next()}
let revBusy=false;
const revMsg=e=>e&&e.quota?QUOTA_MSG:NET_MSG;
// الجواب يُطلب من السيرفر لحظة الإجابة، فالاختيار ينتظر الرد قبل أن تنقلب البطاقة
async function pick(i){
  if(answered||revBusy)return;
  const c=cur,first=!S.cards[c.id],sec=Math.min(180,Math.round((Date.now()-cardT)/1000));
  const btn=app.querySelectorAll('.front .opt')[i];
  revBusy=true;stopTimer();if(btn)btn.classList.add('sel','wait');revLoading(true);
  try{await qReveal(c,i,first)}
  catch(e){
    revBusy=false;revLoading(false);
    if(isKick(e)||cur!==c||view!=='study')return;
    if(btn)btn.classList.remove('sel','wait');
    toast(revMsg(e));if(S.timer)startTimer();
    return;
  }
  revBusy=false;
  if(cur!==c||view!=='study')return;   // غادر الطالب السؤال أثناء انتظار الجواب
  answered=true;rated=false;
  ChF={id:c.id,first:first,opt:i};
  const ok=i===c.a;pendSec=sec;
  if(!ok){
    rated=true;record(false,1,pendSec);
    flip(`<p class="res no">الجواب خاطئ</p>${optsHtml('back',i)}${expHtml()}
    <button class="btn block" id="nx">${qi+1<Q.length?'السؤال التالي':'نهاية الجلسة'}</button>`);
    $('nx').onclick=next;
    $('nx').focus({preventScroll:true});
    return;
  }
  flip(`<p class="res ok">جوابك صحيح</p>${optsHtml('back',i)}${expHtml()}${rateHtml([2,3,4])}`);
  bindRate();
}
async function reveal(timeout){
  if(answered||revBusy)return;
  const c=cur,sec=Math.min(180,Math.round((Date.now()-cardT)/1000));
  const rv=$('rv');
  revBusy=true;stopTimer();if(rv)rv.disabled=true;revLoading(true);
  try{await qReveal(c,null,false)}
  catch(e){
    revBusy=false;revLoading(false);
    if(isKick(e)||cur!==c||view!=='study')return;
    if(rv)rv.disabled=false;
    toast(revMsg(e));
    return;
  }
  revBusy=false;
  if(cur!==c||view!=='study')return;
  answered=true;rated=false;pendSec=sec;
  if(timeout){
    rated=true;record(false,1,pendSec);
    flip(`<p class="res no">انتهى الوقت</p>${backOpts(-1)}${expHtml()}
      <button class="btn block" id="nx">${qi+1<Q.length?'السؤال التالي':'نهاية الجلسة'}</button>`);

  }else{
    flip(`<p class="res mid">كيف كان تذكّرك؟</p>${backOpts(-1)}${expHtml()}${rateHtml([1,2,3,4])}`);
    bindRate();
  }
}
function record(ok,grade,sec){
  const now=Date.now();
  const st=fsrsApply(Object.assign({},S.cards[cur.id]||{}),grade,now);
  st.s=cur.s;st.sy=cur.sy||null;st.ex=cur.ex;
  addStat(cur,ok,sec);recT=now;
  sendAns(cur.id,ok);
  if(!S.cards[cur.id])newDayRec().n++;
  S.cards[cur.id]=st;
  S.log.push({t:now,ok});if(S.log.length>300)S.log=S.log.slice(-300);
  sess.n++;if(ok)sess.ok++;
  if(grade===1&&!sess.rq[cur.id]){sess.rq[cur.id]=1;Q.push(cur)}
  saveResume(qi+1);
}
function next(){
  if(recT){addSec(Math.min(120,Math.round((Date.now()-recT)/1000)));recT=0}
  qi++;qi<Q.length?showCard():summary();
}
function startTimer(){
  stopTimer();tEnd=Date.now()+60000;

    const left=tEnd-Date.now();
    if(ti)ti.style.transform=`scaleX(${Math.max(0,left/60000)})`;

}
function stopTimer(){if(tId){clearInterval(tId);tId=null}}

  const mre=$('more');if(mre)mre.onclick=async()=>{mre.disabled=true;let r;try{r=await sb.rpc('q_more')}catch(e){r={error:{}}}if(r.error){mre.disabled=false;srvErr(r.error);toast(NET_MSG);return}newDayRec().x=(newDayRec().x||0)+10;save();start(sess.subj,sess.sp,sess.sy,{mode:sess.mode})};

/* ---------- الامتحان التجريبي ---------- */
let X=null;
function stopExamTimer(){if(X&&X.tid){clearInterval(X.tid);X.tid=null}}
const mmss=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad2(m):m)+':'+pad2(s)};
function examAvail(){
  const subIds=Object.keys(Store.subs);
  if(F.sj)return stats({s:F.sj,ex:F.exam}).open;
  if(F.sp)return stats({sp:F.sp,ex:F.exam}).open;

function examLabel(){return F.sj?subjOf(F.sj).n:(F.sp?spById(F.sp).n:(Object.keys(Store.subs).length?'اختصاصاتي':'الأسئلة المفتوحة'))}
function examSetup(){

    <label class="fld"><span>الوقت لكل سؤال</span><select class="in" id="xt"><option value="60" selected>دقيقة</option><option value="90">دقيقة ونصف</option><option value="120">دقيقتان</option></select></label>

    closeModal();examStart(n||20,per||60);

}
async function examStart(n,per){
  const subIds=Object.keys(Store.subs);
  const scoped=!F.sj&&!F.sp&&subIds.length>0;
  const showLoading=()=>{app.innerHTML=`<div class="top"><div class="brand">${brandHtml()}</div></div><p class="empty">جارٍ تحميل الأسئلة…</p>`};
  try{
    if(F.sj)await ensureIndex([F.sj],showLoading);
    else if(F.sp)await ensureIndex(subjectsOf(F.sp).map(x=>x.id),showLoading);
    else if(scoped)await ensureIndex(Store.subjects.filter(x=>subIds.includes(spOfSubj(x))).map(x=>x.id),showLoading);
    else await ensureFree(showLoading);
  }catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  const pool=Object.values(Store.idx).filter(c=>(!scoped||subIds.includes(qSp(c)))&&(!F.sj||c.s===F.sj)&&(!F.sp||qSp(c)===F.sp)&&(F.exam==='all'||c.ex===F.exam));
  if(!pool.length){toast('لا توجد أسئلة مفتوحة بهذا الاختيار.');home();return}
  const a=pool.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  const ents=a.slice(0,Math.min(n,a.length));
  // نص أسئلة هذا الامتحان فقط يُطلب من السيرفر، بدون أجوبة
  let qs;
  try{
    qs=await hydrate(ents,showLoading);
    if(HY.denied>0&&qs.length<ents.length){   // انتهى حد اليوم من الأسئلة الجديدة: يُكمَل الامتحان من أسئلة سبق أن حللتها
      const got=new Set(qs.map(q=>q.id));
      const extra=a.filter(c=>!got.has(c.id)&&S.cards[c.id]).slice(0,ents.length-qs.length);
      if(extra.length)qs=qs.concat(await hydrate(extra,showLoading));
      if(qs.length<ents.length)toast(qs.length?'وصلت للحد اليومي من الأسئلة الجديدة، فالامتحان '+ar(qs.length)+' سؤالاً فقط.':QUOTA_MSG);
    }
  }catch(e){if(!isKick(e)){toast('تعذر تحميل الأسئلة. جرب مرة ثانية.');home()}return}
  if(!qs.length){if(!HY.denied)toast('لا توجد أسئلة مفتوحة بهذا الاختيار.');home();return}
  X={qs:qs,ans:qs.map(()=>-1),i:0,t0:Date.now(),per:per,limit:qs.length*per,label:examLabel(),tid:null,res:null};
  examShow();
  X.tid=setInterval(examTick,1000);
}
function examTick(){
  if(!X||X.res)return;
  const left=X.limit-Math.floor((Date.now()-X.t0)/1000);
  const el=$('xtm');
  if(el){el.textContent=mmss(left);el.className='pill xtm'+(left<=60?' low':'')}
  if(left<=0)examFinish(true);
}
function palHtml(){return X.qs.map((q,i)=>`<button data-p="${i}" class="${X.ans[i]>=0?'done':''}${i===X.i?' curr':''}" aria-label="سؤال ${i+1}">${ar(i+1)}</button>`).join('')}
function examShow(){

  const c=X.qs[X.i];cur=c;
  const sub=subjOf(c.s),left=X.limit-Math.floor((Date.now()-X.t0)/1000),n=X.qs.length;
  const opts=`<ul class="opts">`+c.o.map((t,i)=>`<li><button class="opt${X.ans[X.i]===i?' sel':''}" dir="${dirOf(t)}" data-i="${i}"><span class="l">${LET[i]}</span><span class="t">${esc(t)}</span></button></li>`).join('')+`</ul>`;
  app.innerHTML=`
  <div class="sbar"><button class="back" id="xq" aria-label="خروج"><span>تراجع</span><span class="ba">${ico('chev')}</span></button>
    <span class="pill"><bdi dir="ltr">${ar(X.i+1)} / ${ar(n)}</bdi></span><span class="pill xtm${left<=60?' low':''}" id="xtm">${mmss(left)}</span>
    <button class="btn xfin" id="xf">إنهاء</button></div>
  <div class="scene" style="--sc:${safeC(sub.c)}"><div class="card"><section class="face front" aria-label="السؤال">${tagsHtml()}
    <p class="q" dir="${dirOf(c.q)}">${fmt(c.q)}</p>${opts}</section></div></div>
  <div class="acts" style="margin-top:12px"><button class="btn line" id="xp" ${X.i===0?'disabled':''}>السابق</button><button class="btn" id="xnx">${X.i===n-1?'مراجعة الإجابات':'التالي'}</button></div>
